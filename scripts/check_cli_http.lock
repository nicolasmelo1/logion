# Lockfile for scripts/check_cli_http.py
#
# Permits specific raw-httpx call sites in the CLI. Everything else must
# reach the logion API through the typed SDK (client.v1.<resource>.<op>).
#
# Format — one entry per line, `#` starts a comment:
#   <repo-relative-path> :: <target> :: <reason>
#
# <target> is either:
#   - presigned-url : the call's URL is dynamic (taken from an API
#     payload) — an external presigned object-storage URL with no SDK
#     wrapper; or
#   - a literal substring of the call's URL (a domain or path) to permit
#     a specific external endpoint.
#
# Each entry is a deliberate exception. When the call goes away (or moves
# to the SDK), delete the matching line — a stale entry fails the check.

packages/cli/cli/commands/courses/_uploads_push.py :: presigned-url :: PUT course assets to short-lived presigned object-storage URLs (put_url) returned by create_upload_session; external storage, no SDK wrapper.
packages/cli/cli/commands/course_reviews/_download_handler.py :: presigned-url :: Stream review-bundle files from short-lived presigned object-storage URLs (download_url) returned by get_bundle; external storage, no SDK wrapper.
