name: Release logion-skillmap to PyPI

on:
  push:
    tags: ["logion-skillmap-v*"]
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing logion-skillmap-v* tag to publish"
        required: true
        type: string

env:
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-skillmap-${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tag matches pyproject version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
      channel: ${{ steps.parse.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - id: parse
        run: |
          tag="${RELEASE_TAG#logion-skillmap-v}"
          py=$(uv run python -c "import pathlib, tomllib; print(tomllib.loads(pathlib.Path('packages/skillmap/pyproject.toml').read_text())['project']['version'])")
          test "$tag" = "$py" || { echo "Tag $tag != pyproject $py"; exit 1; }
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          if [[ "$tag" =~ \.dev[0-9]+$ ]]; then
            echo "channel=testpypi" >> "$GITHUB_OUTPUT"
          else
            echo "channel=pypi" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Test package
        run: uv run --package logion-skillmap pytest packages/skillmap/tests -q
      - name: Clean previous build artifacts
        run: rm -rf dist/
      - name: Build sdist + wheel
        run: uv build --package logion-skillmap --wheel --sdist
      - name: Validate distributions
        run: uv run twine check dist/*
      - name: Hash artifacts
        run: |
          cd dist/
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: skillmap-dist
          path: dist/

  publish-pypi:
    needs: [verify, build]
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.verify.outputs.channel }}
      url: ${{ needs.verify.outputs.channel == 'testpypi' && 'https://test.pypi.org/project/logion-skillmap/' || 'https://pypi.org/p/logion-skillmap' }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: skillmap-dist
          path: dist/
      - name: Remove non-distribution artifacts
        run: rm -f dist/SHA256SUMS.txt
      - name: Publish to selected Python index
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          repository-url: ${{ needs.verify.outputs.channel == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
          skip-existing: true

  attach-assets:
    needs: [verify, build, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: skillmap-dist
          path: dist/
      - name: Attach wheel + sdist + SHA256SUMS to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS.txt
