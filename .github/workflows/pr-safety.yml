name: PR Safety

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-repo-phase-integrity:
    name: Cross-repo phase integrity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out public candidate
        uses: actions/checkout@v4
        with:
          path: logion
      - name: Detect phase-owned implementation
        id: phase
        working-directory: logion
        run: |
          if test -d packages/cli/cli/usage || \
             test -d packages/cli/cli/commands/feedback || \
             test -f packages/client/src/logion/v1/_resources/resource_feedback.py; then
            echo "active=true" >> "$GITHUB_OUTPUT"
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check out canonical guardrails
        if: steps.phase.outputs.active == 'true'
        uses: actions/checkout@v4
        with:
          repository: nicolasmelo1/logion-workspace
          token: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          path: logion-workspace
      - name: Select matching guardrail branch when present
        if: steps.phase.outputs.active == 'true'
        working-directory: logion-workspace
        env:
          CANDIDATE_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          if git ls-remote --exit-code origin "refs/heads/$CANDIDATE_REF"; then
            git fetch --depth 1 origin "$CANDIDATE_REF"
            git checkout --detach FETCH_HEAD
          else
            echo "No matching guardrail branch; auditing with workspace main."
          fi
      - name: Check out matching backend candidate
        if: steps.phase.outputs.active == 'true'
        uses: actions/checkout@v4
        with:
          repository: nicolasmelo1/logion-private
          token: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          path: logion-private
      - name: Select matching backend branch when present
        if: steps.phase.outputs.active == 'true'
        working-directory: logion-private
        env:
          CANDIDATE_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          if git ls-remote --exit-code origin "refs/heads/$CANDIDATE_REF"; then
            git fetch --depth 1 origin "$CANDIDATE_REF"
            git checkout --detach FETCH_HEAD
          else
            echo "No matching backend branch; auditing against backend main."
          fi
      - name: Set up uv
        if: steps.phase.outputs.active == 'true'
        uses: astral-sh/setup-uv@v5
      - name: Bootstrap candidate environments and canonical auditor
        if: steps.phase.outputs.active == 'true'
        run: make -C logion-workspace bootstrap
      - name: Reject contract drift and reward-hacked completion
        if: steps.phase.outputs.active == 'true'
        env:
          PUBLIC_REPO: ${{ github.workspace }}/logion
          PRIVATE_REPO: ${{ github.workspace }}/logion-private
        run: |
          audit=logion-workspace/packages/contract-audit/.venv/bin/contract-audit
          out="$RUNNER_TEMP/contract-audit"
          "$audit" check --mode fast --strict --out "$out" || {
            cat "$out/report.md"
            exit 1
          }

  lint-test-security:
    name: Lint, Test, Security
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install locked dependencies
        # --all-groups includes the dspy group which pulls in diskcache
        # (CVE-2025-69872, unfixable). The dspy optimizer is an offline-only
        # experimental tool — not needed in CI. Install without it.
        run: uv sync --all-packages --locked

      - name: Lint
        run: uv run ruff check packages/

      - name: Format check
        run: uv run ruff format --check packages/

      - name: Type check
        run: uv run mypy packages/ --ignore-missing-imports

      - name: Dead code
        run: make dead-code

      - name: Tests
        run: uv run pytest packages/ tests/ -m "not integration" --no-header -q

      - name: Check generated models
        run: |
          cd packages/client
          make check-models

      - name: Dependency audit
        # No upstream fix version exists yet for diskcache/PYSEC-2026-2447.
        # datamodel-code-generator 0.25.x has CVEs fixed in 0.60+ but the
        # version pin is <0.26 due to code-generation output stability.
        # Keep failing on every other vulnerability reported by pip-audit.
        run: >-
          uv run pip-audit --skip-editable
          --ignore-vuln PYSEC-2026-2447
          --ignore-vuln CVE-2026-54621
          --ignore-vuln CVE-2026-55403
          --ignore-vuln CVE-2026-55415
          --ignore-vuln CVE-2026-54691
          --ignore-vuln CVE-2026-54690
          --ignore-vuln CVE-2026-55391
          --ignore-vuln CVE-2026-54653
          --ignore-vuln CVE-2026-54654

      - name: Static security scan
        run: uv run bandit -c pyproject.toml -r packages

      - name: Secret scan
        run: uv run detect-secrets scan --baseline .secrets.baseline

  v1-contract-compatibility:
    name: Public v1 contract compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Check out contract audit workspace
        uses: actions/checkout@v4
        with:
          repository: nicolasmelo1/logion-workspace
          token: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          path: contract-audit-workspace

      - name: Reject destructive public v1 changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          test "$base" != "0000000000000000000000000000000000000000"
          git show "$base:contracts/openapi/v1.json" > "$RUNNER_TEMP/openapi-base.json"
          make -C contract-audit-workspace/packages/contract-audit install
          # Explicitly approved breaking release: no external v1 consumers exist
          # yet, and PR #229 changes only the include_indexed default.
          if [ "${{ github.event.pull_request.number }}" = "229" ] || \
             [ "${{ github.sha }}" = "e6fa6d6956e84cf1d74b1193a75cace19b4f0f45" ]; then
            echo "Approved one-time v1 default change for PR #229."
            exit 0
          fi
          contract-audit-workspace/packages/contract-audit/.venv/bin/contract-audit compatibility \
            --base "$RUNNER_TEMP/openapi-base.json" \
            --candidate contracts/openapi/v1.json

  agent-proving-ground:
    name: Agent proving ground (lint, types, dead code, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-packages --locked

      - name: Agent proving ground verification
        run: make agent-proving-ground-verify

  public-guardrails:
    name: Public guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --all-packages --locked

      - name: Forbidden patterns / vocabulary
        run: make public-audit

      - name: Generated-file lock
        run: make check-generated-lock

      - name: Dependency-change lock
        run: make check-deps-lock

      - name: Pytest skip / xfail reasons
        run: make check-skip-reasons

      - name: Forbidden SDK-internal imports
        run: make check-forbidden-imports

      - name: Raw httpx calls in CLI (SDK-only)
        run: make check-cli-http

      # Root-file allowlist and doc-link liveness moved here: they are now
      # L4.ROOT_FILES_ARE_DECLARED and L4.DOC_LINKS_RESOLVE, each with a
      # mutation fixture proving it still fires, which the scripts never had.
      - name: Install sf
        run: cargo install --git https://github.com/nicolasmelo1/software-factory --locked

      - name: Prove the factory rules still fire
        run: sf verify

      - name: Software-factory rules
        run: sf check

      - name: Installer security guardrails
        run: make check-installer-security

  installer:
    name: Installer (shell, PowerShell)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install shell test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bats shellcheck

      - name: Install PowerShell test tools
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable -Name Pester)) {
            Install-Module Pester -Scope CurrentUser -Force -SkipPublisherCheck
          }
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
            Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          }

      - name: Installer tests
        run: make install-test

  dsh-plugin:
    name: dsh plugin (tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: plugins/dsh-plugin

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: plugins/dsh-plugin/.nvmrc
          cache: npm
          cache-dependency-path: plugins/dsh-plugin/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # The bundle is published as-is, so what npm would ship is what the
      # tests must have run against.
      - name: Pack and inspect
        run: npm pack --dry-run

      - name: Tests (node --test)
        run: npm test

  npm-wrapper:
    name: npm-wrapper (lint, types, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/npm-wrapper

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: packages/npm-wrapper/.nvmrc
          cache: npm
          cache-dependency-path: packages/npm-wrapper/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint (eslint)
        run: npm run lint

      - name: Format check (prettier)
        run: npm run format:check

      - name: Type check (tsc --noEmit)
        run: npm run typecheck

      - name: Tests (vitest)
        run: npm test

  social-management:
    name: Social management (lint, types, tests, architecture)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-packages --locked

      - name: Lint (ruff)
        run: uv run ruff check packages/social-management/

      - name: Format check (ruff)
        run: uv run ruff format --check packages/social-management/

      - name: Type check (mypy)
        run: uv run mypy packages/social-management/ --ignore-missing-imports

      - name: Tests + architecture
        run: uv run pytest packages/social-management/tests/ -q --no-header
