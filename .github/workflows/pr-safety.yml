name: PR Safety

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-test-security:
    name: Lint, Test, Security
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --all-packages --all-groups --locked

      - name: Lint
        run: uv run ruff check packages/

      - name: Format check
        run: uv run ruff format --check packages/

      - name: Type check
        run: uv run mypy packages/ --ignore-missing-imports

      - name: Tests
        run: uv run pytest packages/ -m "not integration" --no-header -q

      - name: Check generated models
        run: |
          cd packages/client
          make check-models

      - name: Dependency audit
        # CVE-2025-12695 (dspy): Medium 5.9 — sandbox escape in PythonInterpreter.
        #   Not used here: we only use dspy.Signature/Module/Predict/BootstrapFewShot/MIPROv2.
        # CVE-2025-69872 (diskcache): Critical 9.8 — pickle deserialization RCE.
        #   Transitive dep of dspy (optional [dspy] extra). Our optimizer runs offline
        #   with no untrusted cache-dir exposure. Both are false positives for our use case.
        run: uv run pip-audit --skip-editable --ignore-vuln CVE-2025-12695 --ignore-vuln CVE-2025-69872

      - name: Static security scan
        run: uv run bandit -c pyproject.toml -r packages

      - name: Secret scan
        run: uv run detect-secrets scan --baseline .secrets.baseline
