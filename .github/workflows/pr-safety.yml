name: PR Safety

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-test-security:
    name: Lint, Test, Security
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install locked dependencies
        # --all-groups includes the dspy group which pulls in diskcache
        # (CVE-2025-69872, unfixable). The dspy optimizer is an offline-only
        # experimental tool — not needed in CI. Install without it.
        run: uv sync --all-packages --locked

      - name: Lint
        run: uv run ruff check packages/

      - name: Format check
        run: uv run ruff format --check packages/

      - name: Type check
        run: uv run mypy packages/ --ignore-missing-imports

      - name: Dead code
        run: make dead-code

      - name: Tests
        run: uv run pytest packages/ tests/ -m "not integration" --no-header -q

      - name: Check generated models
        run: |
          cd packages/client
          make check-models

      - name: Dependency audit
        run: uv run pip-audit --skip-editable

      - name: Static security scan
        run: uv run bandit -c pyproject.toml -r packages

      - name: Secret scan
        run: uv run detect-secrets scan --baseline .secrets.baseline

  public-guardrails:
    name: Public guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --all-packages --locked

      - name: Forbidden patterns / vocabulary
        run: make public-audit

      - name: Generated-file lock
        run: make check-generated-lock

      - name: Root-file allowlist
        run: make check-root-files

      - name: Dependency-change lock
        run: make check-deps-lock

      - name: Doc-link liveness
        run: make check-doc-links

      - name: Pytest skip / xfail reasons
        run: make check-skip-reasons

      - name: Forbidden SDK-internal imports
        run: make check-forbidden-imports

      - name: Installer security guardrails
        run: make check-installer-security

  installer:
    name: Installer (shell, PowerShell)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install shell test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bats shellcheck

      - name: Install PowerShell test tools
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable -Name Pester)) {
            Install-Module Pester -Scope CurrentUser -Force -SkipPublisherCheck
          }
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
            Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          }

      - name: Installer tests
        run: make install-test

  npm-wrapper:
    name: npm-wrapper (lint, types, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/npm-wrapper

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: packages/npm-wrapper/.nvmrc
          cache: npm
          cache-dependency-path: packages/npm-wrapper/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint (eslint)
        run: npm run lint

      - name: Format check (prettier)
        run: npm run format:check

      - name: Type check (tsc --noEmit)
        run: npm run typecheck

      - name: Tests (vitest)
        run: npm test

  social-management:
    name: Social management (lint, types, tests, architecture)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-packages --locked

      - name: Lint (ruff)
        run: uv run ruff check packages/social-management/

      - name: Format check (ruff)
        run: uv run ruff format --check packages/social-management/

      - name: Type check (mypy)
        run: uv run mypy packages/social-management/ --ignore-missing-imports

      - name: Tests + architecture
        run: uv run pytest packages/social-management/tests/ -q --no-header
