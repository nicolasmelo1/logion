name: Release all Logion packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, without leading v"
        required: true
        type: string
      smoke_findings_base64:
        description: "Base64-encoded release-smoke-findings.md"
        required: true
        type: string
      publish_store:
        description: "Publish the first-party companion to the Logion store"
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-all-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    name: Prepare, tag, and publish store
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://github.com/${{ github.repository }}/releases
    env:
      VERSION: ${{ inputs.version }}
      PUBLISH_STORE: ${{ inputs.publish_store && '1' || '' }}
      LOGION_API_KEY: ${{ secrets.LOGION_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version-file: packages/npm-wrapper/.nvmrc
          cache: npm
          cache-dependency-path: packages/npm-wrapper/package-lock.json
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync Python workspace dependencies
        run: uv sync --all-packages --locked
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install sf
        run: >
          cargo install --git https://github.com/nicolasmelo1/software-factory
          --rev b06be44f6c982dac58b898778d7dba224d9ed7b1 --locked
      - name: Install npm wrapper dependencies
        working-directory: packages/npm-wrapper
        run: npm ci --ignore-scripts
      - name: Install shell test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bats shellcheck
      - name: Install PowerShell test tools
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable -Name Pester)) {
            Install-Module Pester -Scope CurrentUser -Force -SkipPublisherCheck
          }
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
            Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          }
      - name: Configure release git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Configure smoke findings path
        run: echo "SMOKE_FINDINGS=$RUNNER_TEMP/release-smoke-findings.md" >> "$GITHUB_ENV"
      - name: Decode smoke findings
        env:
          SMOKE_FINDINGS_BASE64: ${{ inputs.smoke_findings_base64 }}
        run: |
          printf '%s' "$SMOKE_FINDINGS_BASE64" | base64 --decode > "$SMOKE_FINDINGS"
      - name: Validate smoke findings
        run: >
          uv run python scripts/release_smoke.py check
          "$SMOKE_FINDINGS"
          --version "$VERSION"
      - name: Reject store publication for development releases
        run: |
          if [[ "$VERSION" =~ \.dev[0-9]+$ && -n "$PUBLISH_STORE" ]]; then
            echo "Development releases publish only to TestPyPI and GitHub assets; set publish_store=false." >&2
            exit 1
          fi
      - name: Run coordinated release
        run: make release VERSION="$VERSION"
      - name: Summarize coordinated publishers
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          Release ${VERSION} was committed and tagged.

          Reusable publisher workflows run after this job:
          - logion-skillmap-v${VERSION} -> release-skillmap.yml
          - logion-client-v${VERSION} -> release-client.yml
          - logion-cli-v${VERSION} -> release-cli.yml and release-npm.yml
          - logion-companion-v${VERSION} -> release-companion.yml

          Store publication requested: ${PUBLISH_STORE:-0}
          EOF

  publish-skillmap:
    needs: release
    uses: ./.github/workflows/release-skillmap.yml
    with:
      tag: logion-skillmap-v${{ inputs.version }}
    secrets: inherit # pragma: allowlist secret

  publish-client:
    needs: release
    uses: ./.github/workflows/release-client.yml
    with:
      tag: logion-client-v${{ inputs.version }}
    secrets: inherit # pragma: allowlist secret

  publish-cli:
    needs: [release, publish-skillmap]
    uses: ./.github/workflows/release-cli.yml
    with:
      tag: logion-cli-v${{ inputs.version }}
    secrets: inherit # pragma: allowlist secret

  publish-npm:
    needs: [release, publish-cli]
    uses: ./.github/workflows/release-npm.yml
    with:
      tag: logion-cli-v${{ inputs.version }}
    secrets: inherit # pragma: allowlist secret

  publish-companion:
    needs: release
    uses: ./.github/workflows/release-companion.yml
    with:
      tag: logion-companion-v${{ inputs.version }}
    secrets: inherit # pragma: allowlist secret
