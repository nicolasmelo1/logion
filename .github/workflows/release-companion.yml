name: Release logion-companion

on:
  push:
    tags: ["logion-companion-v*"]
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing logion-companion-v* tag to publish"
        required: true
        type: string

env:
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-companion-${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tag matches pyproject version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - id: parse
        run: |
          tag="${RELEASE_TAG#logion-companion-v}"
          py=$(uv run python -c "import pathlib, tomllib; print(tomllib.loads(pathlib.Path('packages/agent-companion/pyproject.toml').read_text())['project']['version'])")
          test "$tag" = "$py" || { echo "Tag $tag != pyproject $py"; exit 1; }
          echo "version=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --package logion-agent-companion --frozen
      - name: Build bundle
        run: >
          uv run python packages/agent-companion/scripts/package_skill.py build
          --out dist/
          --version "${{ needs.verify.outputs.version }}"
          --release
      - name: Verify bundle
        run: >
          uv run python packages/agent-companion/scripts/verify_bundle.py
          "dist/logion-marketplace-companion-${{ needs.verify.outputs.version }}.tar.gz"
      - name: Compute SHA256SUMS
        run: |
          cd dist/
          sha256sum logion-marketplace-companion-*.tar.gz SKILL.md manifest.json > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: companion-bundle
          path: dist/

  attach:
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: companion-bundle
          path: dist/
      - name: Attach bundle + manifest + checksums to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            dist/logion-marketplace-companion-${{ needs.verify.outputs.version }}.tar.gz
            dist/SKILL.md
            dist/manifest.json
            dist/SHA256SUMS.txt