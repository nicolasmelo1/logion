name: Release logion-companion

on:
  push:
    tags: ["logion-companion-v*"]

permissions:
  contents: write

concurrency:
  group: release-companion-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: parse
        run: |
          tag="${GITHUB_REF_NAME#logion-companion-v}"
          py=$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('packages/agent-companion/pyproject.toml').read_text())['project']['version'])")
          test "$tag" = "$py" || { echo "Tag $tag != pyproject $py"; exit 1; }
          echo "version=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --package logion-agent-companion --frozen
      - name: Build bundle
        run: uv run python packages/agent-companion/scripts/package_skill.py build --out dist/ --version ${{ needs.verify.outputs.version }} --release
      - name: Verify bundle
        run: uv run python packages/agent-companion/scripts/verify_bundle.py dist/logion-marketplace-companion-${{ needs.verify.outputs.version }}.tar.gz
      - name: Compute SHA256SUMS
        run: |
          cd dist/
          sha256sum * > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: companion-bundle
          path: dist/

  attach:
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: companion-bundle
          path: dist/
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/logion-marketplace-companion-${{ needs.verify.outputs.version }}.tar.gz
            dist/SKILL.md
            dist/manifest.json
            dist/SHA256SUMS.txt