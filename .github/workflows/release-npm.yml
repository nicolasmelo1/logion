name: Release @logionsh/cli to npm

on:
  push:
    tags: ["logion-cli-v*"]
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing logion-cli-v* tag to publish"
        required: true
        type: string

env:
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-npm-${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      !contains(github.event_name == 'push' && github.ref_name || inputs.tag, '.dev')
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@logionsh/cli
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: packages/npm-wrapper/.nvmrc
          registry-url: "https://registry.npmjs.org/"
          cache: "npm"
          cache-dependency-path: "packages/npm-wrapper/package-lock.json"
      - name: Wait for PyPI CLI version to appear
        run: |
          version="${RELEASE_TAG#logion-cli-v}"
          for _ in $(seq 1 30); do
            if python3 - <<PY
          import json, urllib.request, sys
          version = "$version"
          data = json.load(urllib.request.urlopen("https://pypi.org/pypi/logion-cli/json", timeout=15))
          sys.exit(0 if version in data.get("releases", {}) else 1)
          PY
            then
              exit 0
            fi
            sleep 10
          done
          exit 1
      - name: Install dependencies
        working-directory: packages/npm-wrapper
        run: npm ci --ignore-scripts
      - name: Build
        working-directory: packages/npm-wrapper
        run: npm run build
      - name: Pin version from manifest
        run: node packages/npm-wrapper/dist/scripts/version-from-manifest.js
      - name: Pack and inspect
        working-directory: packages/npm-wrapper
        run: npm pack --dry-run
      - name: Publish with provenance
        working-directory: packages/npm-wrapper
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance
