name: Publish to PyPI

on:
  push:
    tags:
      # Matches: logion-cli-v*, logion-client-v*
      - 'logion-*-v*'

permissions:
  id-token: write  # OIDC for Trusted Publisher
  contents: read

jobs:
  publish:
    name: Build & Publish
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-packages --locked

      - name: Determine package from tag
        id: pkg
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ "$tag" =~ ^logion-cli-v ]]; then
            echo "package=logion-cli" >> "$GITHUB_OUTPUT"
          elif [[ "$tag" =~ ^logion-client-v ]]; then
            echo "package=logion-client" >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: tag $tag does not match any publishable package"
            exit 1
          fi

      - name: Build distributions
        run: uv build --package ${{ steps.pkg.outputs.package }} --wheel --sdist

      - name: Validate distributions
        run: uv run twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v3
        with:
          packages-dir: dist/
          skip-existing: true