name: Release logion-cli to PyPI

on:
  push:
    tags: ["logion-cli-v*"]
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing logion-cli-v* tag to publish"
        required: true
        type: string

env:
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-cli-${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tag matches pyproject version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
      channel: ${{ steps.parse.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - id: parse
        run: |
          tag="${RELEASE_TAG#logion-cli-v}"
          py=$(uv run python -c "import pathlib, tomllib; print(tomllib.loads(pathlib.Path('packages/cli/pyproject.toml').read_text())['project']['version'])")
          test "$tag" = "$py" || { echo "Tag $tag != pyproject $py"; exit 1; }
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          if [[ "$tag" =~ \.dev[0-9]+$ ]]; then
            echo "channel=testpypi" >> "$GITHUB_OUTPUT"
          else
            echo "channel=pypi" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Clean previous build artifacts
        run: rm -rf dist/
      - name: Build sdist + wheel
        run: uv build --package logion-cli --wheel --sdist
      - name: Validate distributions
        run: uv run twine check dist/*
      - name: Hash artifacts
        run: |
          cd dist/
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cli-dist
          path: dist/

  publish-pypi:
    needs: [verify, build]
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.verify.outputs.channel }}
      url: ${{ needs.verify.outputs.channel == 'testpypi' && 'https://test.pypi.org/project/logion-cli/' || 'https://pypi.org/p/logion-cli' }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cli-dist
          path: dist/
      - name: Wait for matching skillmap version on selected index
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          PYPI_INDEX_URL: ${{ needs.verify.outputs.channel == 'testpypi' && 'https://test.pypi.org/pypi' || 'https://pypi.org/pypi' }}
        run: |
          for i in $(seq 1 30); do
            if python3 - <<PY
          import json, os, urllib.request, sys
          version = os.environ["VERSION"]
          index_url = os.environ["PYPI_INDEX_URL"]
          data = json.load(urllib.request.urlopen(f"{index_url}/logion-skillmap/json", timeout=15))
          sys.exit(0 if version in data.get("releases", {}) else 1)
          PY
            then
              exit 0
            fi
            echo "Waiting for skillmap version (attempt ${i}/30)..."
            sleep 10
          done
          exit 1
      - name: Remove non-distribution artifacts
        run: rm -f dist/SHA256SUMS.txt
      - name: Publish to selected Python index
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          repository-url: ${{ needs.verify.outputs.channel == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
          skip-existing: true

  attach-assets:
    needs: [verify, build, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cli-dist
          path: dist/
      - name: Attach wheel + sdist + SHA256SUMS to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS.txt
