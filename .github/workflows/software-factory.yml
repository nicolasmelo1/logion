name: software factory hazards

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# The rules themselves run in pr-safety.yml, alongside the checks they
# replaced. This workflow carries only the hazard tooling, which needs a
# different toolchain and has nothing to do with the rest of that job.
jobs:
  hazards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pip-audit bandit vulture
      - name: Dependency vulnerabilities
        run: pip-audit
      - name: Insecure patterns
        run: bandit -r . -c pyproject.toml
      - name: Dead code
        run: vulture .
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dependency vulnerabilities
        run: npm audit --audit-level=high
      - name: Insecure patterns
        run: npx --yes semgrep --config auto --error
      - name: Dead code
        run: npx --yes knip
