name: Deploy landing to Vercel

"on":
  workflow_dispatch: {}
  push:
    branches: [main]
    # Everything the deployed site is built from. Without the last three a
    # contract change, a generator change or a fix to this workflow lands on
    # main and production silently keeps serving the previous build -- which
    # is exactly how /docs kept answering with the old redirect.
    paths:
      - "packages/landing/**"
      - "contracts/openapi/v1.json"
      - "scripts/gen_docs.py"
      - ".github/workflows/deploy-landing-vercel.yml"

permissions:
  contents: read

concurrency:
  group: deploy-landing-vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    if: github.repository == 'nicolasmelo1/logion' && github.actor == 'nicolasmelo1'
    runs-on: ubuntu-latest
    env:
      # Vercel CLI uses these to know exactly which project to deploy to.
      # Without VERCEL_PROJECT_ID/VERCEL_ORG_ID the CLI falls back to
      # creating a project named after the working directory (i.e.
      # "landing"), which is why we previously ended up with a stray
      # project. With both env vars set, --scope is redundant.
      VERCEL_TOKEN: ${{ secrets.VERCEL_LANDING_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_LANDING_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_LANDING_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5

      # From the workspace root, not packages/landing. The docs tests need
      # two things from one interpreter: fastapi, a landing dependency, and
      # the client plus skillmap, which scripts/gen_docs.py imports when the
      # tests shell out to it. Only the fully synced workspace has both --
      # `packages/landing` misses the latter, the root without this step
      # misses the former.
      - name: Install the workspace
        run: uv sync --all-packages --all-groups --locked

      - name: Run landing tests
        run: uv run pytest packages/landing/tests -q

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Vercel commands run from the repo root because the project's
      # configured Root Directory is "packages/landing". Running from
      # packages/landing would have Vercel append that root on top of
      # the CWD and look for packages/landing/packages/landing.
      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token "$VERCEL_TOKEN"

      - name: Deploy landing to production
        id: deploy
        run: |
          deployment_url="$(vercel deploy --prod \
            --token "$VERCEL_TOKEN" \
            --meta githubDeployment=1 \
            --meta githubCommitRef="${GITHUB_REF_NAME}" \
            --meta githubCommitSha="${GITHUB_SHA}" \
            --meta githubOrg="${GITHUB_REPOSITORY_OWNER}" \
            --meta githubRepo="${GITHUB_REPOSITORY#*/}")"
          echo "deployment_url=${deployment_url}" >> "$GITHUB_OUTPUT"
          echo "Production deployment: ${deployment_url}" >> "$GITHUB_STEP_SUMMARY"
