name: Bug Report
description: Report a bug or unexpected behavior in Logion
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A clear description of the bug.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `logion --version`
      placeholder: "e.g. logion 0.1.0"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Operating system where the bug occurs
      options:
        - macOS
        - Linux
        - Windows
        - Other
    validations:
      required: true

  - type: input
    id: python_version
    attributes:
      label: Python version
      description: Output of `python --version`
      placeholder: "e.g. Python 3.12.4"
    validations:
      required: true

  - type: dropdown
    id: install_path
    attributes:
      label: Install method
      description: How did you install Logion?
      options:
        - curl-installer
        - pipx
        - uv
        - npm/npx
        - source
    validations:
      required: true

  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: Steps to reproduce
      description: Exact steps to trigger the bug.
      placeholder: |
        1. Run `logion ...`
        2. Observe error
    validations:
      required: true

  - type: textarea
    id: expected_vs_actual
    attributes:
      label: Expected vs actual behavior
      description: What you expected to happen and what actually happened.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log output (remove any secrets or tokens first).
      render: shell
    validations:
      required: false