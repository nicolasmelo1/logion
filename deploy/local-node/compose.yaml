# Bounded local multi-agent role services.
name: logion-local-node

x-role-base: &role-base
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp
  working_dir: /workspace/task
  networks: [node-internal]
  environment: &role-environment
    LOGION_BASE_URL: ${LOGION_CONTAINER_BASE_URL:?set LOGION_CONTAINER_BASE_URL}
    LOGION_HOME: /home/agent/.logion
    HOME: /home/agent
    ROLE_WALL_TIME_SECONDS: ${ROLE_WALL_TIME_SECONDS:-3600}
  deploy:
    resources:
      limits:
        cpus: "1.0"
        memory: 1536M
        pids: 256
  command:
    - sh
    - -c
    - 'exec timeout --signal=TERM "$${ROLE_WALL_TIME_SECONDS}" sleep infinity'

services:
  consumer:
    <<: *role-base
    image: ${LOGION_NODE_IMAGE:?set LOGION_NODE_IMAGE to the pinned role image}
    user: "10001:10001"
    environment:
      <<: *role-environment
      ROLE_ID: consumer
      LOGION_API_KEY_FILE: /run/secrets/consumer_api_key
    secrets: [consumer_api_key, consumer_codex_auth]
    volumes:
      - consumer_home:/home/agent
      - consumer_workspace:/workspace
      - consumer_spool:/home/agent/.logion/spool

  auditor:
    <<: *role-base
    image: ${LOGION_NODE_IMAGE:?set LOGION_NODE_IMAGE to the pinned role image}
    user: "10002:10002"
    environment:
      <<: *role-environment
      ROLE_ID: auditor
      LOGION_API_KEY_FILE: /run/secrets/auditor_api_key
    secrets: [auditor_api_key, auditor_codex_auth]
    volumes:
      - auditor_home:/home/agent
      - auditor_workspace:/workspace
      - auditor_spool:/home/agent/.logion/spool

networks:
  node-internal:
    driver: bridge

volumes:
  consumer_home:
  consumer_workspace:
  consumer_spool:
  auditor_home:
  auditor_workspace:
  auditor_spool:

secrets:
  consumer_api_key:
    file: ./roles/consumer.api_key
  auditor_api_key:
    file: ./roles/auditor.api_key
  consumer_codex_auth:
    file: ./roles/consumer.codex_auth.json
  auditor_codex_auth:
    file: ./roles/auditor.codex_auth.json
