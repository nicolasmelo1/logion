[project]
name = "logion"
version = "0.1.0"
description = "Open-source Logion workspace."
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = [
    "packages/cli",
    "packages/client",
    "packages/landing",
    "packages/agent-companion",
    "packages/agent-proving-ground",
    "packages/scanners",
    "packages/social-management",
    "packages/skillmap",
    "packages/bot",
    "packages/indexer",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4,<1.10.0",
    "detect-secrets>=1.5.0,<1.6.0",
    "gitpython>=3.1.55,<4.0.0",
    "mypy>=1.15,<2.0.0",
    "pip>=26.1.2",
    "pip-audit>=2.10.0,<2.11.0",
    "pytest>=9.0.3,<9.1.0",
    "python-semantic-release>=10.6.1,<10.7.0",
    "ruff>=0.15.12,<0.16.0",
    "respx>=0.22,<0.23",
    "twine>=6.1,<7.0",
    "vulture>=2.14,<3.0",
]

[tool.ruff]
line-length = 79
target-version = "py312"
preview = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
extend-select = [
    "A",
    "ARG",
    "ASYNC",
    "C4",
    "C901",
    "DTZ",
    "E302",
    "E501",
    "ERA",
    "FBT",
    "I001",
    "ICN",
    "ISC",
    "LOG",
    "N",
    "PGH",
    "PIE",
    "PT",
    "RET",
    "RUF",
    "SIM",
    "T20",
    "TRY",
    "W292",
]
explicit-preview-rules = true
ignore = [
    "FBT001",
    "FBT002",
    "N818",
    "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"scripts/release_manifest.py" = ["T201"]
# Release automation scripts: console output is the primary UI.
"scripts/release_orchestrator.py" = ["T201"]
"scripts/release_store.py" = ["T201"]
"scripts/release_smoke.py" = ["T201"]
# Guardrail: prints its findings to the console.
"scripts/check_cli_http.py" = ["T201"]
# Build utility: console output (T201) and long checksum/URL literals (E501).
"packages/landing/scripts/subset_brand_fonts.py" = ["T201", "E501"]
# OG-image generator: console output (T201) and the Greek matrix-rain glyph
# string (RUF001 ambiguous letters are intentional brand motif).
"packages/landing/scripts/gen_og_image.py" = ["T201", "RUF001"]

[tool.ruff.lint.isort]
known-first-party = ["cli", "landing", "logion", "logion_bot", "logion_scanners", "social_management", "logion_indexer"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.pytest.ini_options]
pythonpath = ["packages/client/src", "packages/cli", "packages/scanners", "packages/social-management", "packages/bot", "packages/indexer", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: integration tests requiring a running mock server (deselect with '-m \"not integration\"')",
    "docker: tests requiring Docker (deselect with '-m \"not docker\"')",
]

[tool.mypy]
exclude = ["tests/"]

[tool.vulture]
min_confidence = 80
paths = [
    "packages/cli/cli",
    "packages/client/src",
    "packages/agent-companion",
]
exclude = [
    "packages/client/src/logion/v1/_types/generated",
    "packages/client/src/logion/v1/_generated",
    "packages/*/tests",
    "packages/agent-companion/evals",
]

[tool.bandit]
exclude_dirs = [
    "tests",
    ".venv",
    "packages/client/src/logion/v1/_types/generated",
]
# B101: assert (we use it intentionally).
# B404/B603/B607: subprocess module + shell=False launches + PATH-resolved
#   binaries are the recommended pattern, not a vulnerability.  The
#   agent-companion eval commands intentionally boot local binaries
#   (llama-server, uv, hf, python) by PATH name.
# B310: urlopen against URLs constructed from vetted YAML provider
#   configs (local llama-server health check).
skips = ["B101", "B105", "B404", "B603", "B607", "B310"]
