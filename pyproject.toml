[project]
name = "logion"
version = "0.1.0"
description = "Open-source Logion workspace."
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = [
    "packages/cli",
    "packages/client",
    "packages/landing",
    "packages/agent-companion",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4,<1.10.0",
    "detect-secrets>=1.5.0,<1.6.0",
    "mypy>=1.15,<2.0.0",
    "pip>=26.1.2",
    "pip-audit>=2.10.0,<2.11.0",
    "pytest>=9.0.3,<9.1.0",
    "python-semantic-release>=10.5.3,<10.6.0",
    "ruff>=0.15.12,<0.16.0",
    "twine>=6.1,<7.0",
]

[tool.ruff]
line-length = 79
target-version = "py312"
preview = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
extend-select = [
    "A",
    "ARG",
    "ASYNC",
    "C4",
    "C901",
    "DTZ",
    "E302",
    "E501",
    "ERA",
    "FBT",
    "I001",
    "ICN",
    "ISC",
    "LOG",
    "N",
    "PGH",
    "PIE",
    "PT",
    "RET",
    "RUF",
    "SIM",
    "T20",
    "TRY",
    "W292",
]
explicit-preview-rules = true
ignore = [
    "FBT001",
    "FBT002",
    "N818",
    "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"scripts/release_manifest.py" = ["T201"]

[tool.ruff.lint.isort]
known-first-party = ["cli", "landing", "logion"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.pytest.ini_options]
pythonpath = ["packages/client/src", "packages/cli"]
markers = [
    "integration: integration tests requiring a running mock server (deselect with '-m \"not integration\"')",
]

[tool.mypy]
exclude = ["tests/"]

[tool.bandit]
exclude_dirs = [
    "tests",
    ".venv",
    "packages/client/src/logion/v1/_types/generated",
]
# B101: assert (we use it intentionally).
# B404/B603/B607: subprocess module + shell=False launches + PATH-resolved
#   binaries are the recommended pattern, not a vulnerability.  The
#   agent-companion eval commands intentionally boot local binaries
#   (llama-server, uv, hf, python) by PATH name.
# B310: urlopen against URLs constructed from vetted YAML provider
#   configs (local llama-server health check).
skips = ["B101", "B404", "B603", "B607", "B310"]