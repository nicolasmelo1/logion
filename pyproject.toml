[project]
name = "logion"
version = "0.1.0"
description = "Open-source Logion workspace."
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = [
    "packages/cli",
    "packages/client",
    "packages/landing",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "detect-secrets>=1.5.0",
    "mypy>=1.15,<2",
    "pip-audit>=2.10.0",
    "pytest>=8.0,<9",
    "python-semantic-release>=10.5.3,<10.6.0",
    "ruff>=0.15.12,<0.16.0",
]

[tool.ruff]
line-length = 79
target-version = "py312"
preview = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
extend-select = [
    "A",
    "ARG",
    "ASYNC",
    "C4",
    "C901",
    "DTZ",
    "E302",
    "E501",
    "ERA",
    "FBT",
    "I001",
    "ICN",
    "ISC",
    "LOG",
    "N",
    "PIE",
    "PT",
    "RET",
    "RUF",
    "SIM",
    "T20",
    "TRY",
    "W292",
]
explicit-preview-rules = true
ignore = [
    "FBT001",
    "FBT002",
    "N818",
    "TRY003",
]

[tool.ruff.lint.isort]
known-first-party = ["cli", "landing", "logion"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.bandit]
exclude_dirs = [
    "tests",
    ".venv",
    "packages/client/src/logion/v1/_types/generated",
]
skips = ["B101"]
