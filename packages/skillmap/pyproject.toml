[project]
name = "logion-skillmap"
version = "0.2.0.dev1"
description = "Deterministic package-map inference engine for Logion."
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Logion contributors" }]
keywords = ["logion", "skillmap", "package-map", "inference"]
dependencies = ["pyyaml>=6.0"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<9.1.0",
    "ruff>=0.15.12,<0.16.0",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "logion_skillmap"

[tool.ruff]
line-length = 79
target-version = "py311"
preview = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
extend-select = [
    "A",
    "ANN401",
    "ARG",
    "ASYNC",
    "C4",
    "C901",
    "DTZ",
    "E302",
    "E501",
    "ERA",
    "FBT",
    "I001",
    "ICN",
    "ISC",
    "LOG",
    "N",
    "PGH",
    "PIE",
    "PT",
    "RET",
    "RUF",
    "SIM",
    "T20",
    "TID251",
    "TRY",
    "W292",
]
explicit-preview-rules = true
ignore = [
    "FBT001",
    "FBT002",
    "N818",
    "TRY003",
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Repo-wide ban on `typing.Any`. Banning the *import* is what makes it
# stick: it kills `dict[str, Any]`, `list[Any]`, `-> Any` and bare
# `x: Any` in one rule, instead of only the top-level annotations
# ANN401 can see.
"typing.Any" = { msg = "Use a TypedDict/dataclass for a known shape, JsonValue/JsonObject from the package's _json module at a JSON boundary, or a TypeVar for generic passthrough. If a third-party stub genuinely forces Any, add a narrow per-file-ignore for TID251 with a comment saying why." }

[tool.ruff.lint.isort]
known-first-party = ["logion_skillmap"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.per-file-ignores]
# Pinned commit SHAs carry an inline detect-secrets pragma that pushes the
# line past the length limit; the pins are the point of the fixture.
"tests/test_fixture_repos.py" = ["E501"]

[tool.mypy]
exclude = ["tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]