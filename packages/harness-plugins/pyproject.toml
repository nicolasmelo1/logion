[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "logion-harness-plugins"
version = "0.1.0"
description = "Logion observer plugin - thin harness hooks for use observation"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["logion", "observation", "harness", "plugin", "telemetry"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[tool.hatch.build.targets.wheel]
packages = ["logion_harness_plugins"]