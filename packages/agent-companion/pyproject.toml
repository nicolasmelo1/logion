[project]
name = "logion-agent-companion"
version = "0.1.0"
description = "Logion Marketplace Companion — skill for discovering, acquiring, installing, updating, and managing Logion courses/capabilities."
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0,<7.0",
]

[tool.uv.sources]
logion-cli = { workspace = true }

[dependency-groups]
dev = [
    "logion-cli",
    "pytest>=9.0.3,<9.1.0",
    "ruff>=0.15.12,<0.16.0",
    "mypy>=1.15,<2.0.0",
    "pyyaml>=6.0,<7.0",
    "types-PyYAML>=6.0,<7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/logion_agent_companion"]

[tool.hatch.build.targets.wheel.force-include]
"SKILL.md" = "logion_agent_companion/SKILL.md"
"course" = "logion_agent_companion/course"
"references" = "logion_agent_companion/references"
"scripts" = "logion_agent_companion/scripts"

[tool.ruff]
line-length = 79
target-version = "py312"
preview = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
extend-select = [
    "A",
    "ARG",
    "ASYNC",
    "C4",
    "C901",
    "DTZ",
    "E302",
    "E501",
    "ERA",
    "FBT",
    "I001",
    "ICN",
    "ISC",
    "LOG",
    "N",
    "PIE",
    "PT",
    "RET",
    "RUF",
    "SIM",
    "T20",
    "TRY",
    "W292",
]
explicit-preview-rules = true
ignore = [
    "FBT001",
    "FBT002",
    "N818",
    "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"scripts/package_skill.py" = ["T201"]

[tool.ruff.lint.isort]
known-first-party = ["cli", "landing", "logion", "logion_agent_companion"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.mypy]
exclude = ["tests/"]