[project]
name = "logion-agent-companion"
version = "0.1.5"
description = "Logion Marketplace Companion — skill for discovering, acquiring, installing, updating, and managing Logion courses/capabilities."
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0,<7.0",
]

[tool.uv.sources]
logion-cli = { workspace = true }

[project.optional-dependencies]
dspy = [
    "dspy>=3.0.4,<4.0",
    # Required by MIPROv2 for Bayesian instruction/demo search.
    "optuna>=3.6,<5.0",
]

[dependency-groups]
dev = [
    "logion-cli",
    "pytest>=9.0.3,<9.1.0",
    "ruff>=0.15.12,<0.16.0",
    "mypy>=1.15,<2.0.0",
    "pyyaml>=6.0,<7.0",
    "types-PyYAML>=6.0,<7.0",
]

# NOTE: keep in sync with [project.optional-dependencies] dspy above.
# uv dependency-groups and PEP 621 optional-dependencies are consumed
# by different tooling (``uv run --group dspy`` vs
# ``pip install -e '.[dspy]'``), so both must list the same version range.
dspy = [
    "dspy>=3.0.4,<4.0",
    "optuna>=3.6,<5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The companion ships as a skill bundle (SKILL.md + references + scripts)
# through Logion's marketplace and through the workspace's download
# installer — not as a pip-installable Python wheel.  The wheel target
# below produces an empty distribution and exists only so uv recognises
# this directory as a valid workspace member.
[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.ruff]
line-length = 79
target-version = "py312"
preview = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
extend-select = [
    "A",
    "ARG",
    "ASYNC",
    "C4",
    "C901",
    "DTZ",
    "E302",
    "E501",
    "ERA",
    "FBT",
    "I001",
    "ICN",
    "ISC",
    "LOG",
    "N",
    "PIE",
    "PT",
    "RET",
    "RUF",
    "SIM",
    "T20",
    "TRY",
    "W292",
]
explicit-preview-rules = true
ignore = [
    "FBT001",
    "FBT002",
    "N818",
    "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"scripts/package_skill.py" = ["T201", "C901"]
"scripts/verify_bundle.py" = ["T201", "C901"]
# Graders are a flat list of rule checks; nested-if / complexity rules
# would push them into a less readable shape. The CLI prints by design.
"evals/harness/graders.py" = ["SIM102", "C901"]
"evals/run_eval.py" = ["T201"]
"tests/test_eval_harness.py" = ["FBT003", "ARG002"]
# DSPy optimizer CLIs print by design; split_scenarios uses argparse
# and is a standalone script. Both inject sys.path before imports
# (no-install evals/ is not a package on the wheel).
"evals/optimizers/dspy/optimize_policy.py" = ["T201", "E402"]
"evals/optimizers/dspy/optimize_references.py" = ["T201", "E402", "ARG002"]
"evals/optimizers/dspy/reference_routing_metric.py" = ["ARG002"]
"evals/optimizers/dspy/split_scenarios.py" = ["T201", "ERA001", "E402"]
"evals/optimizers/dspy/render_candidate.py" = ["T201"]
# Operator commands are CLI entry points: printing is the UI.
"evals/commands/*.py" = ["T201"]
"tests/test_reference_routing.py" = ["FBT003", "ARG002"]

[tool.ruff.lint.isort]
known-first-party = ["cli", "landing", "logion"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.mypy]
exclude = ["tests/"]

[tool.semantic_release]
build_command = "uv build"
commit_message = """\
chore(release): logion-companion@{version} [skip ci]

Automatically generated by python-semantic-release
"""
commit_parser = "conventional"
tag_format = "logion-companion-v{version}"
version_toml = ["pyproject.toml:project.version"]
version_variables = ["_version.py:__version__"]
upload_to_pypi = false
upload_to_release = false

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.branches."rc/*"]
match = "rc/.*"
prerelease = true
prerelease_token = "rc"

[tool.semantic_release.commit_parser_options]
path_filters = ["packages/agent-companion/"]
allowed_tags = ["feat", "fix", "perf", "refactor", "chore", "docs", "test", "build", "ci"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.semantic_release.changelog]
mode = "update"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"
