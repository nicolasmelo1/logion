# course/capabilities.yaml — Logion Marketplace Companion
#
# Canonical Logion capability manifest.  Validated by the same code path
# the CLI and marketplace API use, so this file dogfoods the schema all
# course authors must follow.  The semantic feature list (recall.search,
# course.author, ...) lives in references/companion-capabilities.md and
# is not part of this manifest.

version: 1

summary: >-
  Recall-first companion for discovering, inspecting, installing,
  updating, creating, and managing Logion courses without loading the
  whole marketplace into context.

tools:
  - file
  - terminal

network:
  allow_domains: []

filesystem:
  read:
    - .
  write: []

secrets:
  env: []

human_approval:
  required: true
