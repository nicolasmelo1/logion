suite: course-selection

# Course selection precision: when two courses overlap, the agent must
# choose the right one. Confusion pairs are explicit (acceptable +
# forbidden) so graders detect a wrong pick.

scenarios:
  - id: select-clips-not-editor
    prompt: "Make a 15-second highlight clip from this long video."
    installed_capabilities: []
    local_recall: []
    catalog_fixture: fake-marketplace.yaml
    expected:
      should_query_marketplace: true
      should_ask_confirmation: true
      acceptable_course_ids: [video.clips]
      forbidden_course_ids: [video.editor]
      max_courses_inspected: 3
    fake_trace:
      calls:
        - tool: logion_recall_search
          args: {query: "highlight clip", limit: 5}
        - tool: logion_listings_search
          args: {query: "video short clip"}
        - tool: logion_courses_get
          args: {course_id: video.clips}
      final_answer: "video.clips fits ($9). Confirm install?"
      selected_course_ids: [video.clips]

