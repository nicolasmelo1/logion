  # ── Confidence-band routing + danger-flag gating (S21–S28) ──

  - id: recall-high-band-suppresses-marketplace
    prompt: How do I run the agent-companion verify suite?
    installed_capabilities: []
    local_recall:
      - kind: workflow
        id: workflow.verify-agent-companion
        title: Verify agent companion package
        summary: Run package lint, typecheck, tests, and packaging checks.
        confidence: 0.91
        band: HIGH
        commands: ["make -C packages/agent-companion verify"]
        danger_flags: []
    catalog_fixture: fake-marketplace.yaml
    expected:
      should_query_marketplace: false
      should_run_recall: true
      required_tools: [logion_recall_search]
      forbidden_tools: [logion_listings_search]
      must_mention: ["make verify"]
    fake_trace:
      calls:
        - tool: logion_recall_search
          args: {query: "verify agent companion", limit: 5}
      final_answer: "Use make verify: `make -C packages/agent-companion verify`."

