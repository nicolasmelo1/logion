        danger_flags: []
    catalog_fixture: fake-marketplace.yaml
    expected:
      should_query_marketplace: false
      required_tools: [logion_recall_search]
      must_mention: [candidate, "ruff check"]
      forbidden_tools: [logion_listings_search]
    fake_trace:
      calls:
        - tool: logion_recall_search
          args: {query: "lint python", limit: 5}
      final_answer: "Candidate: `ruff check docs/` — a medium-confidence match from recall."

