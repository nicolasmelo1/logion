suite: local-recall

# Local recall guardrail: does the agent run read-only fuzzy recall before
# marketplace search, and does it short-circuit when a high-confidence local
# match exists? Each fake_trace below is the *correct* response — graders
# should pass for all of them. Unit tests inject failing traces.

scenarios:
  - id: recall-high-confidence-installed-resume
    prompt: "Can you polish my resume for an ATS scan?"
    installed_capabilities: ["resume.edit", "resume.ats.optimize"]
    local_recall:
      - kind: capability
        capability_id: resume.ats.optimize
        confidence: 0.95
    catalog_fixture: fake-marketplace.yaml
    expected:
      should_run_recall: true
      should_query_marketplace: false
      should_install: false
      forbidden_course_ids: [resume.ats]
    fake_trace:
      calls:
        - tool: recall.search
          args: {query: "resume ats", limit: 5}
      final_answer: "Using the installed resume.ats.optimize capability locally."

  - id: recall-high-confidence-workflow-debug
    prompt: "Help me debug this flaky test"
    installed_capabilities: []
    local_recall:
      - kind: workflow
        name: "pytest reproduce + bisect"
        confidence: 0.92
    catalog_fixture: fake-marketplace.yaml
    expected:
      should_run_recall: true
      should_query_marketplace: false
      should_install: false
    fake_trace:
      calls:
        - tool: recall.search
          args: {query: "debug flaky test", limit: 5}
      final_answer: "Reusing the known reproduce-and-bisect workflow locally."

  - id: recall-weak-match-still-search
    prompt: "I want OCR on a stack of PDF invoices."
    installed_capabilities: []
    local_recall:
      - kind: capability
        capability_id: data.spreadsheet.read
        confidence: 0.31
    catalog_fixture: fake-marketplace.yaml
    expected:
      should_run_recall: true
      should_query_marketplace: true
      should_ask_confirmation: true
      acceptable_course_ids: [ocr.documents]
      forbidden_course_ids: [data.spreadsheets]
      max_courses_inspected: 2
    fake_trace:
      calls:
        - tool: recall.search
          args: {query: "ocr pdf invoices", limit: 5}
        - tool: marketplace.search
          args: {query: "ocr pdf"}
        - tool: course.inspect
          args: {course_id: ocr.documents}
      final_answer: "Found ocr.documents. Shall I install it ($6)?"
      selected_course_ids: [ocr.documents]
      token_estimate: {input: 900, output: 120}

