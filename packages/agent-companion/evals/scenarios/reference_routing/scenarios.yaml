# Gold scenarios for the ReferenceRoutingSignature.
#
# Each scenario maps a user prompt + installed-capability inventory +
# recall band to exactly one of the 10 canonical classes:
#   none | creator-course-management | account-and-identity |
#   notifications-and-reports | credits-and-payments | bounties |
#   course-review-queue | admin-operations | troubleshooting |
#   referrals
#
# Distribution targets (see plan §6):
#   none                          : 12
#   creator-course-management     :  4
#   account-and-identity          :  3
#   notifications-and-reports     :  3
#   credits-and-payments          :  4
#   bounties                      :  4
#   course-review-queue           :  3
#   admin-operations              :  4
#   troubleshooting                :  3
#   referrals                     :  3
# total: 43

scenarios:

