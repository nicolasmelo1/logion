suite: context-efficiency

# Context efficiency: never load the full catalog, never inspect dozens of
# unrelated courses, never auto-load every installed skill artifact.

scenarios:
  - id: ctx-inspect-at-most-3
    prompt: "Find me a weather skill."
    installed_capabilities: []
    local_recall: []
    catalog_fixture: fake-marketplace.yaml
    expected:
      should_query_marketplace: true
      should_ask_confirmation: true
      acceptable_course_ids: [weather.basic]
      max_courses_inspected: 3
      max_loaded_skills: 0
    fake_trace:
      calls:
        - tool: logion_recall_search
          args: {query: "weather", limit: 5}
        - tool: logion_listings_search
          args: {query: "weather"}
        - tool: logion_courses_get
          args: {course_id: weather.basic}
      final_answer: "weather.basic (free). Confirm install?"
      selected_course_ids: [weather.basic]

  - id: ctx-skill-load-only-on-need
    prompt: "What's 12 squared?"
    installed_capabilities: ["data.analyze", "weather.forecast"]
    local_recall: []
    catalog_fixture: fake-marketplace.yaml
    expected:
      should_query_marketplace: false
      should_install: false
      max_loaded_skills: 0
      forbidden_tools: [logion_skills_inspect]
    fake_trace:
      calls: []
      final_answer: "144"

  - id: ctx-load-only-selected-skill
    prompt: "Use my installed pivot capability."
    installed_capabilities: ["data.spreadsheet.pivot"]
