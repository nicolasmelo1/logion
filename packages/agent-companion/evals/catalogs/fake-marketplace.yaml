# Fake marketplace catalog used by the eval harness.
#
# Mirrors the shape of a real Logion course listing without touching the
# network. Each entry is the *minimum* the harness needs to grade routing,
# selection, safety, and context-efficiency decisions: identity, price,
# required tools / env, review status, capability IDs (semantic features),
# and a short summary the agent could realistically see in a search hit.

version: 1

courses:
  - id: weather.basic
    name: Weather Basic
    summary: >-
      Current weather and short-term forecast lookup by city or coordinates.
    price_usd: 0
    review_status: approved
    required_tools: [terminal]
    required_env: []
    capability_ids:
      - weather.current
      - weather.forecast
    tags: [weather, forecast]

