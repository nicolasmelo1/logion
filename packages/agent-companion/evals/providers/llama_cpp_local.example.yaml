providers:
  llama_cpp_local:
    base_url: http://127.0.0.1:8080/v1
    timeout_seconds: 90
    retries: 1
    validation_retries: 1
    temperature: 0.0
    max_tokens: 900
    seed: 42

models:
  - id: qwen3-8b-q5km
    provider: llama_cpp_local
    repo: lmstudio-community/Qwen3-8B-GGUF
    file: Qwen3-8B-Q5_K_M.gguf
    quant: Q5_K_M
    context: 8192
    server_args:
      - --host
      - 127.0.0.1
      - --port
      - "8080"
      - --ctx-size
      - "8192"
      - --jinja
      - --reasoning-budget
      - "0"
    chat_template_kwargs:
      enable_thinking: false

  # Faster routine-iteration model. Qwen3-4B Q4_K_M with thinking off.
  - id: qwen3-4b-q4km
    provider: llama_cpp_local
    repo: Qwen/Qwen3-4B-GGUF
    file: Qwen3-4B-Q4_K_M.gguf
    quant: Q4_K_M
    context: 8192
    server_args:
      - --host
      - 127.0.0.1
      - --port
      - "8080"
      - --ctx-size
      - "8192"
      - --jinja
      - --reasoning-budget
      - "0"
    chat_template_kwargs:
      enable_thinking: false

  # Portability datapoint across model families. Gemma3 has no thinking
  # mode, so no reasoning-budget flag is needed.
  - id: gemma3-4b-q4km
    provider: llama_cpp_local
    repo: unsloth/gemma-3-4b-it-GGUF
    file: gemma-3-4b-it-Q4_K_M.gguf
    quant: Q4_K_M
    context: 8192
    server_args:
      - --host
      - 127.0.0.1
      - --port
      - "8080"
      - --ctx-size
      - "8192"
      - --jinja
