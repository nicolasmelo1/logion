schema_version: "1"
name: harness_scope_and_observation_contract
description: |
  Exercise the public CLI against isolated native harness directories using a
  real coding agent and the local devrig API. Assertions consume CLI JSON and
  filesystem artifacts; scripted agents and mock API adapters are not valid.
api_adapter: local-devrig
driver_config:
  codex:
    model: gpt-5.4-mini
execution_requirements:
  api_adapters: [local-devrig]
  agent_drivers: [codex]
  driver_models:
    codex: [gpt-5.4-mini]

agents:
  - id: operator
    role: Node operator verifying harness scope contracts
    driver: codex
    workspace: operator
    devrig_role: admin
    timeout_seconds: 900

phases:
  - id: inventory-native-scopes
    actor: operator
    local_hook: packages/agent-proving-ground/scripts/setup_harness_scope_fixture.py
    local_hook_args: ["${AGENT_OPERATOR_WORKSPACE}"]
    local_hook_capture_json:
      FIXTURE_ROOT: fixture_root
      NESTED_CWD: nested_cwd
      ISOLATED_HOME: isolated_home
      EVIDENCE_DIR: evidence_dir
      BEFORE_SNAPSHOT: snapshot_path
    goal: |
      Use the public Logion CLI from ${LOGION_PUBLIC_REPO_PATH} (run it as
      "uv run --project ${LOGION_PUBLIC_REPO_PATH} logion"). Set HOME to
      ${ISOLATED_HOME}. Run these four commands exactly, one per harness,
      and save each JSON output to ${EVIDENCE_DIR}/inventory-<harness>.json:
        uv run --project ${LOGION_PUBLIC_REPO_PATH} logion resources inventory --harness codex --json --cwd ${NESTED_CWD} --repo-root ${FIXTURE_ROOT} > ${EVIDENCE_DIR}/inventory-codex.json
        uv run --project ${LOGION_PUBLIC_REPO_PATH} logion resources inventory --harness claude-code --json --cwd ${NESTED_CWD} --repo-root ${FIXTURE_ROOT} > ${EVIDENCE_DIR}/inventory-claude-code.json
        uv run --project ${LOGION_PUBLIC_REPO_PATH} logion resources inventory --harness hermes --json --cwd ${NESTED_CWD} --repo-root ${FIXTURE_ROOT} > ${EVIDENCE_DIR}/inventory-hermes.json
        uv run --project ${LOGION_PUBLIC_REPO_PATH} logion resources inventory --harness pi --json --cwd ${NESTED_CWD} --repo-root ${FIXTURE_ROOT} > ${EVIDENCE_DIR}/inventory-pi.json
      Do not fabricate or edit the output files. Stop with a failure if any
      command fails.
    success_hint: Four CLI JSON files exist and contain the seeded acme skill.
    assertions:
      - type: api.harness_scope_targets_resolved
        params:
          artifacts:
            codex: "${EVIDENCE_DIR}/inventory-codex.json"
            claude-code: "${EVIDENCE_DIR}/inventory-claude-code.json"
            hermes: "${EVIDENCE_DIR}/inventory-hermes.json"
            pi: "${EVIDENCE_DIR}/inventory-pi.json"
          required_scopes: [repo-current, repo-root, user]

  - id: acquire-zero-write
    actor: operator
    goal: |
      Use the public Logion CLI from ${LOGION_PUBLIC_REPO_PATH} (run it as
      "uv run --project ${LOGION_PUBLIC_REPO_PATH} logion"). Set HOME to
      ${ISOLATED_HOME} and LOGION_API_KEY from the environment. Search for
      one indexed agent-skill resource:
        logion resources search "" --resource-type agent_skill --json --base-url http://localhost:8000
      Parse the first resource ID from the JSON data.items array. Then run:
        logion resources acquire <RESOURCE_ID> --harness codex
          --scope repo-root --cwd ${NESTED_CWD} --repo-root ${FIXTURE_ROOT}
          --dry-run --json --base-url http://localhost:8000
      Save the unmodified JSON output as ${EVIDENCE_DIR}/acquire-codex.json.
      Do not write into any native target. Stop with a failure if any
      command fails.
    success_hint: The saved plan resolves ${FIXTURE_ROOT}/.agents/skills.
    assertions:
      - type: api.resource_acquire_plan_dry_run
        params:
          artifact: "${EVIDENCE_DIR}/acquire-codex.json"
          expected_scope: repo-root
          expected_target: "${FIXTURE_ROOT}/.agents/skills"
          before_snapshot: "${BEFORE_SNAPSHOT}"
          snapshot_roots: ["${FIXTURE_ROOT}", "${ISOLATED_HOME}"]

  - id: nested-default-scope
    actor: operator
    goal: |
      Use the same CLI invocation pattern as the previous phase
      (uv run --project ${LOGION_PUBLIC_REPO_PATH} logion, HOME set to
      ${ISOLATED_HOME}, LOGION_API_KEY from env, --base-url
      http://localhost:8000). Run resources acquire for the same resource
      ID you found previously, for codex, claude-code, and pi, with
      --cwd ${NESTED_CWD} --repo-root ${FIXTURE_ROOT} --dry-run --json
      but WITHOUT --scope. Save each JSON plan as
      ${EVIDENCE_DIR}/nested-<harness>.json. Do not install anything.
    success_hint: Every plan defaults to the XPTO repository root, never user.
    assertions:
      - type: api.harness_scope_nested_repo
        params:
          artifacts:
            codex: "${EVIDENCE_DIR}/nested-codex.json"
            claude-code: "${EVIDENCE_DIR}/nested-claude-code.json"
            pi: "${EVIDENCE_DIR}/nested-pi.json"
          expected_root: "${FIXTURE_ROOT}"

  - id: inventory-ambiguity
    actor: operator
    goal: |
      Inspect the inventory JSON already produced for Codex and Claude Code.
      Do not modify it. Explain why the seeded acme resources remain separate
      candidates with explicit precedence and ambiguity state.
    success_hint: Multiple acme candidates remain distinct and ambiguous.
    assertions:
      - type: api.harness_inventory_distinct_scopes
        params:
          artifacts:
            codex: "${EVIDENCE_DIR}/inventory-codex.json"
            claude-code: "${EVIDENCE_DIR}/inventory-claude-code.json"
          resource_name: acme

  - id: observation-minimal-disclosure
    actor: operator
    goal: |
      Use the public Logion CLI from ${LOGION_PUBLIC_REPO_PATH} (run it as
      "uv run --project ${LOGION_PUBLIC_REPO_PATH} logion"). Set HOME to
      ${ISOLATED_HOME}. Use the CLI's observation command to create one
      consented local observation under ${AGENT_OPERATOR_WORKSPACE}/logion-home.
      Use opaque IDs, no paths or task text, and the versioned minimal
      envelope. The observation file should be at
      ${AGENT_OPERATOR_WORKSPACE}/logion-home/observations/observations.jsonl.
      Save nothing else and do not alter the resulting JSONL file.
    success_hint: The spool has one sanctioned minimal-disclosure envelope.
    assertions:
      - type: api.observation_envelope_no_raw_data
        params:
          artifact: "${AGENT_OPERATOR_WORKSPACE}/logion-home/observations/observations.jsonl"

final_assertions:
  - type: timeline.no_unredacted_secret
  - type: api.resource_acquire_plan_dry_run
    params:
      artifact: "${EVIDENCE_DIR}/acquire-codex.json"
      expected_scope: repo-root
      expected_target: "${FIXTURE_ROOT}/.agents/skills"
      before_snapshot: "${BEFORE_SNAPSHOT}"
      snapshot_roots: ["${FIXTURE_ROOT}", "${ISOLATED_HOME}"]
  - type: api.harness_inventory_distinct_scopes
    params:
      artifacts:
        codex: "${EVIDENCE_DIR}/inventory-codex.json"
        claude-code: "${EVIDENCE_DIR}/inventory-claude-code.json"
      resource_name: acme
  - type: api.observation_envelope_no_raw_data
    params:
      artifact: "${AGENT_OPERATOR_WORKSPACE}/logion-home/observations/observations.jsonl"
