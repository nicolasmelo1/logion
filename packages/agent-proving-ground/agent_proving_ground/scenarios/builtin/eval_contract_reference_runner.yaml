schema_version: "1"
name: eval_contract_reference_runner
description: |
  Validate the golden eval contract with the published package, execute it
  twice on the reference runner, exercise the five stable rejection classes
  against the node, convert one deterministic companion scenario, and retain
  the digest chain, conversion identity sets, and no-500 evidence the 16.1
  gate recomputes.
api_adapter: local-devrig
execution_requirements:
  api_adapters: [local-devrig]
  agent_drivers: [codex, claude-code]
driver_config:
  codex: {model: gpt-5.4-mini}
  claude-code: {model: claude-haiku-4-5}
agents:
  - id: node_operator
    role: Host operator acquiring eval evidence
    driver: codex
    devrig_role: admin
    timeout_seconds: 1200
  - id: auditor
    role: Independent evidence auditor
    driver: codex
    devrig_role: buyer
    timeout_seconds: 1200
phases:
  - id: prepare_eval_operator_flow
    actor: node_operator
    goal: ""
    local_hook: packages/agent-proving-ground/scripts/run_eval_evidence.py
    local_hook_args:
      - seed
      - "${AGENT_NODE_OPERATOR_WORKSPACE}/evidence/eval"

  - id: node_operator_eval_flow
    actor: node_operator
    goal: |
      Operate the long-running consumer role from the operator side. Do not
      start, stop, reset, or inspect another role, and do not install any
      package or use a source checkout. The consumer already has the public
      `logion-node` command and a prepared non-secret eval workflow at
      `/workspace/task/eval-flow/run-eval-flow.sh`.

      Run it inside the consumer container with:

        docker compose --project-directory deploy/local-node -f deploy/local-node/compose.yaml exec -T consumer sh -c 'sh /workspace/task/eval-flow/run-eval-flow.sh'

      Copy the raw directory back to your evidence workspace after it exits:

        mkdir -p "${AGENT_NODE_OPERATOR_WORKSPACE}/evidence/eval/raw" && docker compose --project-directory deploy/local-node -f deploy/local-node/compose.yaml cp consumer:/workspace/task/eval-flow/raw/. "${AGENT_NODE_OPERATOR_WORKSPACE}/evidence/eval/raw"

      The launcher must perform validation, two eval runs, and the comparison
      through the installed public `logion-node` workflow.
    success_hint: |
      Your evidence raw directory contains run-one.json, run-two.json, and
      run-summary.json, and the launcher record shows successful public CLI
      commands for validation, both runs, and comparison.
    assertions:
      - type: files.eval_agent_performed
        params:
          transcript: "${AGENT_NODE_OPERATOR_WORKSPACE}/node_operator_eval_flow.md"
          raw_dir: "${AGENT_NODE_OPERATOR_WORKSPACE}/evidence/eval/raw"

  - id: collect_eval_evidence
    actor: node_operator
    goal: ""
    local_hook: packages/agent-proving-ground/scripts/run_eval_evidence.py
    local_hook_args:
      - collect
      - "${AGENT_NODE_OPERATOR_WORKSPACE}/evidence/eval"

  - id: capture_eval_evidence
    actor: node_operator
    goal: ""
    local_hook: packages/agent-proving-ground/scripts/capture_eval_evidence.py
    local_hook_args:
      - collect
      - "${AGENT_NODE_OPERATOR_WORKSPACE}/evidence/eval.json"
      - "${AGENT_NODE_OPERATOR_WORKSPACE}/evidence/eval"
    local_hook_capture_json:
      EVAL_EVIDENCE_MANIFEST: evidence_manifest
    assertions:
      - type: files.eval_contract_valid
        params:
          manifest: "${EVAL_EVIDENCE_MANIFEST}"
      - type: api.eval_runs_completed
        params:
          manifest: "${EVAL_EVIDENCE_MANIFEST}"
      - type: api.eval_result_digest_stable
        params:
          manifest: "${EVAL_EVIDENCE_MANIFEST}"
      - type: files.eval_reproduced_clean_workspace
        params:
          manifest: "${EVAL_EVIDENCE_MANIFEST}"
      - type: api.invalid_eval_rejected
        params:
          manifest: "${EVAL_EVIDENCE_MANIFEST}"
      - type: files.converted_scenario_assertions_preserved
        params:
          manifest: "${EVAL_EVIDENCE_MANIFEST}"
      - type: api.canonical_digest_agrees
        params:
          manifest: "${EVAL_EVIDENCE_MANIFEST}"
      - type: api.eval_contract_indexed
        params:
          manifest: "${EVAL_EVIDENCE_MANIFEST}"
  - id: verify_api_logs
    actor: auditor
    goal: "Verify the eval evidence run completed without server errors."
    assertions:
      - type: logs.no_500s