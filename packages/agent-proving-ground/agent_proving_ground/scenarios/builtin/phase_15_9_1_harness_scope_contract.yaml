schema_version: "1"
name: phase_15_9_1_harness_scope_contract
description: |
  Exercise the public CLI against isolated native harness directories using a
  real coding agent and the local devrig API. Assertions consume CLI JSON and
  filesystem artifacts; scripted agents and mock API adapters are not valid.
api_adapter: local-devrig
driver_config:
  codex:
    model: gpt-5.4-mini
execution_requirements:
  api_adapters: [local-devrig]
  agent_drivers: [codex]
  driver_models:
    codex: [gpt-5.4-mini]

agents:
  - id: operator
    role: Node operator verifying harness scope contracts
    driver: codex
    workspace: operator
    devrig_role: admin
    timeout_seconds: 900

phases:
  - id: inventory-native-scopes
    actor: operator
    local_hook: packages/agent-proving-ground/scripts/setup_harness_scope_fixture.py
    local_hook_args: ["${AGENT_OPERATOR_WORKSPACE}"]
    local_hook_capture_json:
      FIXTURE_ROOT: fixture_root
      NESTED_CWD: nested_cwd
      ISOLATED_HOME: isolated_home
      EVIDENCE_DIR: evidence_dir
      BEFORE_SNAPSHOT: snapshot_path
    goal: |
      Use only the public Logion CLI from ${LOGION_PUBLIC_REPO_PATH}. Set HOME
      to ${ISOLATED_HOME}. From ${NESTED_CWD}, run resources inventory with
      JSON output for codex, claude-code, hermes, and pi. Save the complete JSON
      outputs as ${EVIDENCE_DIR}/inventory-<harness>.json. Do not fabricate or
      edit the output files. Stop with a failure if any command fails.
    success_hint: Four CLI JSON files exist and contain the seeded acme skill.
    assertions:
      - type: api.harness_scope_targets_resolved
        params:
          artifacts:
            codex: "${EVIDENCE_DIR}/inventory-codex.json"
            claude-code: "${EVIDENCE_DIR}/inventory-claude-code.json"
            hermes: "${EVIDENCE_DIR}/inventory-hermes.json"
            pi: "${EVIDENCE_DIR}/inventory-pi.json"
          required_scopes: [repo-current, repo-root, user]

  - id: acquire-zero-write
    actor: operator
    goal: |
      Query the local devrig through the public CLI for one indexed skill. Parse
      its canonical resource ID from JSON, then run resources acquire for Codex
      with --scope repo-root --cwd ${NESTED_CWD} --repo-root ${FIXTURE_ROOT}
      --dry-run --json. Save the unmodified output as
      ${EVIDENCE_DIR}/acquire-codex.json. Do not write into any native target.
    success_hint: The saved plan resolves ${FIXTURE_ROOT}/.agents/skills.
    assertions:
      - type: api.resource_acquire_plan_dry_run
        params:
          artifact: "${EVIDENCE_DIR}/acquire-codex.json"
          expected_scope: repo-root
          expected_target: "${FIXTURE_ROOT}/.agents/skills"
          before_snapshot: "${BEFORE_SNAPSHOT}"
          snapshot_roots: ["${FIXTURE_ROOT}", "${ISOLATED_HOME}"]

  - id: nested-default-scope
    actor: operator
    goal: |
      For codex, claude-code, and pi, run the same resource acquisition dry-run
      from ${NESTED_CWD} without --scope. Keep HOME=${ISOLATED_HOME}, pass
      --repo-root ${FIXTURE_ROOT}, and save each JSON plan as
      ${EVIDENCE_DIR}/nested-<harness>.json. Do not install anything.
    success_hint: Every plan defaults to the XPTO repository root, never user.
    assertions:
      - type: api.harness_scope_nested_repo
        params:
          artifacts:
            codex: "${EVIDENCE_DIR}/nested-codex.json"
            claude-code: "${EVIDENCE_DIR}/nested-claude-code.json"
            pi: "${EVIDENCE_DIR}/nested-pi.json"
          expected_root: "${FIXTURE_ROOT}"

  - id: inventory-ambiguity
    actor: operator
    goal: |
      Inspect the inventory JSON already produced for Codex and Claude Code.
      Do not modify it. Explain why the seeded acme resources remain separate
      candidates with explicit precedence and ambiguity state.
    success_hint: Multiple acme candidates remain distinct and ambiguous.
    assertions:
      - type: api.harness_inventory_distinct_scopes
        params:
          artifacts:
            codex: "${EVIDENCE_DIR}/inventory-codex.json"
            claude-code: "${EVIDENCE_DIR}/inventory-claude-code.json"
          resource_name: acme

  - id: observation-minimal-disclosure
    actor: operator
    goal: |
      Use the public CLI package's observation API to create one consented local
      observation under ${AGENT_OPERATOR_WORKSPACE}/logion-home. Use opaque IDs,
      no paths or task text, and the versioned minimal envelope. Save nothing
      else and do not alter the resulting JSONL file.
    success_hint: The spool has one sanctioned minimal-disclosure envelope.
    assertions:
      - type: api.observation_envelope_no_raw_data
        params:
          artifact: "${AGENT_OPERATOR_WORKSPACE}/logion-home/observations/observations.jsonl"

final_assertions:
  - type: timeline.no_unredacted_secret
  - type: api.resource_acquire_plan_dry_run
    params:
      artifact: "${EVIDENCE_DIR}/acquire-codex.json"
      expected_scope: repo-root
      expected_target: "${FIXTURE_ROOT}/.agents/skills"
      before_snapshot: "${BEFORE_SNAPSHOT}"
      snapshot_roots: ["${FIXTURE_ROOT}", "${ISOLATED_HOME}"]
  - type: api.harness_inventory_distinct_scopes
    params:
      artifacts:
        codex: "${EVIDENCE_DIR}/inventory-codex.json"
        claude-code: "${EVIDENCE_DIR}/inventory-claude-code.json"
      resource_name: acme
  - type: api.observation_envelope_no_raw_data
    params:
      artifact: "${AGENT_OPERATOR_WORKSPACE}/logion-home/observations/observations.jsonl"
