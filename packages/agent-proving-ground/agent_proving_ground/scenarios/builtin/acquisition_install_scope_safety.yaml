schema_version: "1"
name: acquisition_install_scope_safety
description: |
  Native acquisition end-to-end, in both normative directions: an operator
  discovers a published hosted Course through Logion and acquires it into a
  repository-scoped Codex target, then installs a second capability through
  the real upstream `npx skills` manager and has Logion reconcile it without
  reinstalling or rewriting the manager's state. The run also proves the
  install stayed inside one repository, that tampering with an installed
  artifact is reported as drift, and that re-acquiring is idempotent.
  Assertions consume CLI JSON artifacts, local inventory receipts, and bytes
  on disk; scripted agents and mock API adapters are not valid for the final
  run.
api_adapter: local-devrig
driver_config:
  codex:
    model: gpt-5.4-mini
execution_requirements:
  api_adapters: [local-devrig]
  agent_drivers: [codex]
  driver_models:
    codex: [gpt-5.4-mini]

agents:
  - id: operator
    role: Developer acquiring a capability into one repository
    driver: codex
    workspace: operator
    devrig_role: admin
    timeout_seconds: 900

phases:
  - id: prepare-fixture
    actor: operator
    local_hook: packages/agent-proving-ground/scripts/setup_harness_scope_fixture.py
    local_hook_args: ["${AGENT_OPERATOR_WORKSPACE}"]
    local_hook_capture_json:
      FIXTURE_ROOT: fixture_root
      OTHER_REPO_ROOT: other_repo_root
      NESTED_CWD: nested_cwd
      ISOLATED_HOME: isolated_home
      EVIDENCE_DIR: evidence_dir
      BEFORE_SNAPSHOT: snapshot_path
    goal: ""

  - id: seed-catalog
    actor: operator
    local_hook: packages/agent-proving-ground/scripts/seed_acquisition_fixture.py
    local_hook_capture_json:
      INDEXED_RESOURCE_ID: indexed_resource_id
      INDEXED_VERSION_ID: indexed_version_id
      INDEXED_CHANNEL: indexed_channel
    goal: ""

  - id: discover-and-acquire
    actor: operator
    goal: |
      I need a lightweight code-review capability in the repository at
      ${FIXTURE_ROOT}. Search Logion for one it hosts and distributes
      itself, install it for Codex in that repository — not globally — and
      show me what was installed.

      Use the public Logion CLI (run as
      `uv run --project ${LOGION_PUBLIC_REPO_PATH} logion`) with HOME set to
      ${ISOLATED_HOME} and `--base-url http://localhost:8000` on each
      command. Do not call the HTTP API directly.

      Acquire it through the `logion resources` commands — that is the
      surface under test here, not `logion skills install`. Which resource
      to install is yours to work out.

      Before installing anything, save the zero-write plan to
      ${EVIDENCE_DIR}/plan.json. Then save the final acquisition receipt
      JSON to ${EVIDENCE_DIR}/acquire.json.
    success_hint: |
      evidence/plan.json is a dry-run plan that names the channel, argv,
      expected bytes and permissions; evidence/acquire.json is the receipt
      with verification exact and the installation lives under
      ${FIXTURE_ROOT} only.
    assertions:
      - type: api.resource_acquisition_exists
        params:
          artifact: "${EVIDENCE_DIR}/acquire.json"
      - type: api.resource_distribution_selected
        params:
          artifact: "${EVIDENCE_DIR}/acquire.json"
          allowed_channels: [logion_bundle]
      - type: files.installed_artifact_digest_matches
        params:
          artifact: "${EVIDENCE_DIR}/acquire.json"
          scope_root: "${FIXTURE_ROOT}"
      - type: files.scope_isolation_preserved
        params:
          before_snapshot: "${BEFORE_SNAPSHOT}"
          protected_roots:
            - "${ISOLATED_HOME}"
            - "${OTHER_REPO_ROOT}"

  - id: native-manager-acquisition
    actor: operator
    goal: |
      Now add the upstream skill-discovery helper to the same repository,
      the way its own ecosystem expects: let Logion delegate to the
      `npx skills` manager rather than downloading it itself. Its
      distributions include the `npx_skills` channel — `resources
      distributions RESOURCE_ID` lists them. Review the exact argv Logion
      shows you before approving it.

      Use `logion resources acquire` for this too. Save the receipt to
      ${EVIDENCE_DIR}/native-acquire.json, and leave `skills-lock.json`
      exactly as the manager wrote it.
    success_hint: |
      The skill was installed by npx skills into ${FIXTURE_ROOT}, Logion
      recorded a receipt on the npx_skills channel, and skills-lock.json is
      the manager's own file.
    assertions:
      - type: api.resource_acquisition_exists
        params:
          artifact: "${EVIDENCE_DIR}/native-acquire.json"
          # `skills-lock.json` records a content hash but no commit, so a
          # delegated install cannot honestly claim source_revision.
          allowed_verifications: [source_revision, unverified]
      - type: api.resource_distribution_selected
        params:
          artifact: "${EVIDENCE_DIR}/native-acquire.json"
          allowed_channels: [npx_skills]
      - type: files.scope_isolation_preserved
        params:
          before_snapshot: "${BEFORE_SNAPSHOT}"
          protected_roots:
            - "${ISOLATED_HOME}"
            - "${OTHER_REPO_ROOT}"

  - id: reconcile-inventory
    actor: operator
    goal: |
      In the same environment (HOME=${ISOLATED_HOME}), reconcile local
      installations with the Logion catalog and save the JSON report to
      ${EVIDENCE_DIR}/reconcile.json. Then run the first acquire command
      again, exactly as before, saving the output to
      ${EVIDENCE_DIR}/acquire-second.json — it must succeed cleanly and
      must not leave a second copy behind.
    success_hint: |
      The reconcile report lists both installations, including the one
      installed through npx skills; the second acquire is idempotent.
    assertions:
      - type: files.inventory_receipt_matches
        params:
          artifact: "${EVIDENCE_DIR}/reconcile.json"
          acquire_artifact: "${EVIDENCE_DIR}/acquire.json"
      - type: api.native_install_reconciled
        params:
          artifact: "${EVIDENCE_DIR}/reconcile.json"
          scope_root: "${FIXTURE_ROOT}"
          expected_channel: npx_skills
      - type: api.acquisition_idempotent
        params:
          first_artifact: "${EVIDENCE_DIR}/acquire.json"
          second_artifact: "${EVIDENCE_DIR}/acquire-second.json"
          scope_root: "${FIXTURE_ROOT}"

  - id: tampered-artifact-fails-closed
    actor: operator
    local_hook: packages/agent-proving-ground/scripts/tamper_installed_artifact.py
    local_hook_args:
      ["${EVIDENCE_DIR}/acquire.json", "${FIXTURE_ROOT}"]
    goal: |
      One of the files Logion installed was modified outside Logion. In the
      same environment (HOME=${ISOLATED_HOME}), re-run reconcile and save
      the report to ${EVIDENCE_DIR}/reconcile-drift.json. Report what Logion
      says about it; do not repair, reinstall, or delete anything.
    success_hint: |
      Reconcile reports the tampered installation as drifted instead of
      matched, and nothing was reinstalled.
    assertions:
      - type: files.install_drift_reported
        params:
          artifact: "${EVIDENCE_DIR}/reconcile-drift.json"
          acquire_artifact: "${EVIDENCE_DIR}/acquire.json"

final_assertions:
  - type: timeline.no_unredacted_secret
  - type: logs.no_500s
  - type: files.scope_isolation_preserved
    params:
      before_snapshot: "${BEFORE_SNAPSHOT}"
      protected_roots:
        - "${ISOLATED_HOME}"
        - "${OTHER_REPO_ROOT}"
