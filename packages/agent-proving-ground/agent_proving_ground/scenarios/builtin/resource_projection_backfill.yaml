schema_version: "1"
name: resource_projection_backfill
description: |
  Verify that a node upgrade backfills indexed skills and published courses into
  generic resources, keeps the legacy Course purchase surface working, and is
  safe to rerun without creating resources or links.
api_adapter: local-devrig
driver_config:
  codex:
    model: gpt-5.4-mini
  claude-code:
    model: claude-haiku-4-5

agents:
  - id: operator
    role: Node operator verifying the public resource surface
    driver: codex
    workspace: operator
    devrig_role: admin
    timeout_seconds: 600
  - id: consumer
    role: Consumer discovering and buying a hosted Course
    driver: claude-code
    workspace: consumer
    devrig_role: buyer
    timeout_seconds: 600
  - id: local_hook
    role: Local devrig backfill hook
    driver: scripted
    workspace: local-hook
    devrig_role: admin

phases:
  - id: operator-backfill
    actor: local_hook
    goal: ""
    # Relative to the explicitly configured --devrig-root, not this package.
    local_hook: scripts/devrig/backfill_resources.py
    local_hook_args:
      - --source
      - indexed-listings-and-courses
      - --page-size
      - "50"
    local_hook_capture_json:
      INITIAL_BACKFILL_CREATED: resources_created
      INITIAL_BACKFILL_LINKED: projections_linked
      INITIAL_IDENTITY_SNAPSHOT: identity_snapshot
    assertions:
      - type: api.resource_backfill_applied
        params:
          resources_created: "${INITIAL_BACKFILL_CREATED}"
          projections_linked: "${INITIAL_BACKFILL_LINKED}"
          identity_snapshot: "${INITIAL_IDENTITY_SNAPSHOT}"
      - type: api.resource_backfill_complete

  - id: operator-verifies-resource-status
    actor: operator
    goal: |
      Use only the public Logion CLI resource commands to verify that the node
      exposes the Python debugging skill and hosted Course after the upgrade.
      Inspect their public resource details and report their projection kinds.
      Do not inspect source files or the database.
    success_hint: Public resource details show indexed_listing and published_course.
    assertions:
      - type: api.resource_search_returns_kinds
        params:
          projection_kinds: [indexed_listing, published_course]
          canonicals: ["gh:phase-15-9/python-debugging-skill"]

  - id: consumer-search-resources
    actor: consumer
    goal: |
      Search the upgraded node for the seeded Python debugging skill and hosted
      Course. Inspect each public resource detail and distinguish the indexed
      skill from the hosted Course without inspecting source code or the database.
    success_hint: Resource details show the seeded skill and hosted Course projections.
    assertions:
      - type: api.resource_search_returns_kinds
        params:
          projection_kinds: [indexed_listing, published_course]
          canonicals: ["gh:phase-15-9/python-debugging-skill"]

  - id: consumer-legacy-course-purchase
    actor: consumer
    goal: |
      Purchase the seeded Python debugging Course through the existing Courses
      compatibility surface.
    success_hint: Purchase the existing published Course, not an indexed-only result.
    assertions:
      - type: api.legacy_course_purchase_exists
        params:
          buyer_agent: consumer

  - id: operator-backfill-rerun
    actor: local_hook
    goal: ""
    # The workspace release target supplies the devrig root containing this hook.
    local_hook: scripts/devrig/backfill_resources.py
    local_hook_args:
      - --source
      - indexed-listings-and-courses
      - --page-size
      - "50"
    local_hook_capture_json:
      RERUN_BACKFILL_CREATED: resources_created
      RERUN_BACKFILL_LINKED: projections_linked
      RERUN_IDENTITY_SNAPSHOT: identity_snapshot
    assertions:
      - type: api.resource_backfill_idempotent
        params:
          rerun_created: "${RERUN_BACKFILL_CREATED}"
          rerun_linked: "${RERUN_BACKFILL_LINKED}"
          before_identity_snapshot: "${INITIAL_IDENTITY_SNAPSHOT}"
          after_identity_snapshot: "${RERUN_IDENTITY_SNAPSHOT}"

final_assertions:
  - type: logs.no_500s
  - type: timeline.no_unredacted_secret
  - type: api.resource_projection_exists
    params:
      projection_kind: indexed_listing
  - type: api.resource_backfill_complete
  - type: api.resource_identity_unique
  - type: api.resource_search_returns_kinds
    params:
      projection_kinds: [indexed_listing, published_course]
      canonicals: ["gh:phase-15-9/python-debugging-skill"]
  - type: api.resource_projection_exists
    params:
      projection_kind: published_course
  - type: api.legacy_course_purchase_exists
    params:
      buyer_agent: consumer
  - type: api.no_double_credit_debit
