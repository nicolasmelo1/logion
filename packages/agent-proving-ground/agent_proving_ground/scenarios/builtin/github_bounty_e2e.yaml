schema_version: "1"
name: github_bounty_e2e
# Rig-driven: every phase is a script, no phase is decided by an agent.
# Valid as an integration test, never as evidence about agent behaviour.
kind: rig
description: |
  Create and publish a course, link its repository, open an issue mentioning
  the bot, confirm the bounty, merge a real pull request, and verify the reward
  through real GitHub App webhooks.

agents:
  - id: seller
    role: creator
  - id: buyer
    role: submitter
  - id: admin
    role: reviewer
  - id: local_hook
    role: local_hook

phases:
  - id: sync-app-installation
    actor: local_hook
    # Ensure GitHub App installation is recorded in the local backend DB -> Installation recorded
    goal: ""
    local_hook: ${LOGION_DEVRIG_ROOT}/scripts/devrig/sync_github_app_installation.py
    local_hook_capture_json: {}

  - id: sync-buyer-identity
    actor: local_hook
    # Ensure buyer GitHub identity is linked in the local backend DB -> Buyer identity linked
    goal: ""
    local_hook: ${LOGION_DEVRIG_ROOT}/scripts/devrig/sync_buyer_github_identity.py
    local_hook_capture_json: {}

  - id: create-course
    actor: seller
    # Create a paid course for the E2E bounty -> Course created
    goal: ""
    local_hook: ${LOGION_DEVRIG_ROOT}/scripts/devrig/create_course.py
    local_hook_capture_json:
      COURSE_ID: course_id
      COURSE_SLUG: slug

  - id: publish-course
    actor: seller
    # Upload bundle, request review, approve, and make course public -> Course published
    goal: ""
    local_hook: ${LOGION_DEVRIG_ROOT}/scripts/devrig/publish_course.py
    local_hook_capture_json:
      VERSION_ID: version_id
      REVIEW_ID: review_id

  - id: link-source
    actor: seller
    # Link the published course to the GitHub test repository -> Source link configured
    goal: ""
    local_hook: ${LOGION_DEVRIG_ROOT}/scripts/devrig/link_source.py
    local_hook_capture_json: {}

  - id: open-github-issue
    actor: seller
    # Open a GitHub issue mentioning the Logion bot to trigger a real bounty -> GitHub issue opened
    goal: ""
    local_hook: ${LOGION_DEVRIG_ROOT}/scripts/devrig/open_github_issue.py
    local_hook_capture_json:
      ISSUE_1: issue_number

  - id: confirm-bounty
    actor: seller
    # Confirm the bounty via GitHub issue comment and capture the bounty ID -> Bounty confirmed and funded
    goal: ""
    local_hook: ${LOGION_DEVRIG_ROOT}/scripts/devrig/confirm_bounty.py
    local_hook_capture_json:
      BOUNTY_1: bounty_id

  - id: create-submission-and-pr
    actor: buyer
    # Create a bounty submission and open a real GitHub PR for it -> Submission created and PR opened
    goal: ""
    local_hook: ${LOGION_DEVRIG_ROOT}/scripts/devrig/create_submission_and_pr.py
    local_hook_capture_json:
      SUB_1: submission_id
      PR_1: pr_number
      PR_URL: pr_url
      HEAD_BRANCH: head_branch

  - id: merge-pr-and-verify
    actor: seller
    # Merge the linked PR and verify the bounty is awarded -> PR merged and bounty awarded
    goal: ""
    local_hook: ${LOGION_DEVRIG_ROOT}/scripts/devrig/merge_pr_and_verify.py
    local_hook_capture_json:
      ACCEPTED_SUBMISSION_ID: accepted_submission_id

final_assertions:
  - type: api.course_exists
    params:
      course: ${COURSE_ID}
      expected_status: published

  - type: api.bounty_exists
    params:
      bounty: ${BOUNTY_1}
      expected_status: funded

  - type: api.bounty_submission_exists
    params:
      bounty: ${BOUNTY_1}
      submission: ${SUB_1}
      creator_agent: seller

  - type: github.pr_exists
    params:
      marker: "<!-- logion:bounty_submission:${SUB_1} -->"

  - type: github.pr_merged
    params:
      pr_number: ${PR_1}

  - type: api.bounty_accepted
    params:
      bounty: ${BOUNTY_1}
      submission: ${SUB_1}
      creator_agent: seller

  - type: github.issue_bot_comment_matches
    params:
      issue: ${ISSUE_1}
      pattern: "Bounty opened and funded"
