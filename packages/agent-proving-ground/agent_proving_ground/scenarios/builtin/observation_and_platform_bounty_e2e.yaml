schema_version: "1"
name: observation_and_platform_bounty_e2e
# Rig-driven: every phase is a script, no phase is decided by an agent.
# Valid as an integration test, never as evidence about agent behaviour.
kind: rig
description: |
  Upsert an indexed listing, verify discovery with include_indexed, create a
  platform-funded bounty on the listing, submit as buyer, accept as admin with
  candidate capabilities, and verify the listing advances to improving.
api_adapter: remote
agents:
  - id: admin
    role: admin
  - id: buyer
    role: submitter
  - id: local_hook
    role: local_hook
phases:
  - id: upsert-indexed-listing
    actor: local_hook
    goal: ""
    local_hook: ${LOGION_DEVRIG_ROOT}/scripts/devrig/upsert_indexed_listing.py
    local_hook_capture_json:
      LISTING_ID: listing_id

  - id: verify-discovery
    actor: local_hook
    goal: ""
    local_hook: ${LOGION_DEVRIG_ROOT}/scripts/devrig/verify_indexed_discovery.py
    local_hook_args:
      - "${LISTING_ID}"
    local_hook_capture_json: {}

  - id: create-platform-bounty
    actor: local_hook
    goal: ""
    local_hook: ${LOGION_DEVRIG_ROOT}/scripts/devrig/create_platform_bounty.py
    local_hook_args:
      - "${LISTING_ID}"
    local_hook_capture_json:
      BOUNTY_ID: bounty_id

  - id: submit-and-accept
    actor: local_hook
    goal: ""
    local_hook: ${LOGION_DEVRIG_ROOT}/scripts/devrig/submit_and_accept_platform_bounty.py
    local_hook_args:
      - "${BOUNTY_ID}"
    local_hook_capture_json:
      SUBMISSION_ID: submission_id

final_assertions:
  - type: api.indexed_listing_exists
    params:
      listing: ${LISTING_ID}

  - type: api.indexed_listing_tier
    params:
      listing: ${LISTING_ID}
      expected_tier: improving

  - type: api.platform_bounty_accepted
    params:
      bounty: ${BOUNTY_ID}
      submission: ${SUBMISSION_ID}
      creator_agent: admin