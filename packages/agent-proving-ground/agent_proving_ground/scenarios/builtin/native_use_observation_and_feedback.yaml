schema_version: "1"
name: native_use_observation_and_feedback
description: Real-agent native install, exact local observation, and feedback.
api_adapter: local-devrig
driver_config:
  codex: {model: gpt-5.4-mini}
  claude-code: {model: claude-haiku-4-5}
execution_requirements:
  api_adapters: [local-devrig]
  agent_drivers: [codex]
  driver_models: {codex: [gpt-5.4-mini]}
agents:
  - id: user_a
    role: Developer using a native skill in xpto
    driver: codex
    workspace: user_a
    devrig_role: buyer
    timeout_seconds: 1200
  - id: user_b
    role: Developer proving isolated state in acme
    driver: codex
    workspace: user_b
    devrig_role: buyer
    timeout_seconds: 1200
phases:
  - id: setup
    actor: user_a
    local_hook: packages/agent-proving-ground/scripts/setup_native_feedback_fixture.py
    local_hook_args: ["${AGENT_USER_A_WORKSPACE}"]
    local_hook_capture_json:
      FIXTURE_ROOT: fixture_root
      ISOLATED_HOME: isolated_home
      LOGION_HOME_NATIVE: logion_home
      EVIDENCE_DIR: evidence_dir
    goal: ""
  - id: seed
    actor: user_a
    local_hook: packages/agent-proving-ground/scripts/seed_acquisition_fixture.py
    local_hook_capture_json:
      RESOURCE_ID: indexed_resource_id
      VERSION_ID: indexed_version_id
      ACQUISITION_CHANNEL: indexed_channel
    goal: ""
  - id: native_install_and_use
    actor: user_a
    goal: |
      Work as a customer in ${FIXTURE_ROOT}. Set HOME=${ISOLATED_HOME} and
      LOGION_HOME=${LOGION_HOME_NATIVE}. Use the public CLI via
      uv run --project ${LOGION_PUBLIC_REPO_PATH} logion and base URL
      http://localhost:8000. Inspect resource ${RESOURCE_ID} and install its
      pinned npx_skills distribution with the exact npx skills command shown
      by Logion. Never use resources acquire. Reconcile from skills for Codex,
      repo-root scope, and save the untouched JSON to
      ${EVIDENCE_DIR}/reconcile-xpto.json.
      The reconcile command itself must create the inventory receipt. Never
      create, edit, or reconstruct an inventory receipt manually.

      For every integration and usage command, set HOME=${ISOLATED_HOME} and
      LOGION_HOME=${LOGION_HOME_NATIVE}. Run
      integrations enable codex --dry-run --json first, save it untouched to
      ${EVIDENCE_DIR}/integration-plan.json, then enable the Codex integration
      in prompt mode and verify its status from that same home. Save the
      resulting hooks config to ${EVIDENCE_DIR}/hooks-xpto.json.

      Then use the resource: read the installed SKILL.md and apply it to review
      ${FIXTURE_ROOT}/buggy.py. The observation must come from the hook the
      integration installed, fed the harness's own PostToolUse payload. Do not
      read installation_id out of the receipt and do not hand-assemble an
      observation payload: an agent asserting that it used something is not an
      observation. If your harness cannot deliver the payload, replay the exact
      recorded payload for this harness from
      ${LOGION_PUBLIC_REPO_PATH}/packages/cli/tests/fixtures/hook_payloads/,
      rewriting only its placeholder paths, and pipe that to
      usage observe --harness codex --stdin.

      Save the observe response untouched to ${EVIDENCE_DIR}/observe-xpto.json
      and require disposition recorded; an empty, ignored, or failed response is
      failure, even though the command exits zero. Save usage pending --json to
      ${EVIDENCE_DIR}/pending-xpto.json and confirm it carries an
      observation_group_id. Do not put task data or paths in either payload.
    assertions:
      - type: files.native_use_observed
        params:
          pending_artifact: "${EVIDENCE_DIR}/pending-xpto.json"
          observe_artifact: "${EVIDENCE_DIR}/observe-xpto.json"
          inventory_dir: "${LOGION_HOME_NATIVE}/inventory"
          resource_id: "${RESOURCE_ID}"
      - type: files.feedback_pending
        params: {pending_artifact: "${EVIDENCE_DIR}/pending-xpto.json"}
  - id: inspect_and_submit_feedback
    actor: user_a
    goal: |
      Inspect pending-xpto.json. Submit honest feedback with the same
      resource ${RESOURCE_ID}, version ${VERSION_ID}, rating 4, usefulness
      4, reliability 4, tool-safety 5, token-efficiency 4, completed-task,
      task-class software-development, and repository-safe prose. Do not pass
      an acquisition channel: Logion must resolve it from the local receipt,
      and it must come back as ${ACQUISITION_CHANNEL}. Save the untouched JSON
      response to ${EVIDENCE_DIR}/feedback-first.json.

      Then submit the identical report again. The second attempt must be
      refused by the local tombstone; re-run it with --force and save that
      untouched JSON to ${EVIDENCE_DIR}/feedback-second.json. The two feedback
      IDs must match — one resource version and task class is one report,
      however many times a hook fires.
    assertions:
      - type: api.resource_feedback_exists
        params: {reporter_agent: user_a, resource_id: "${RESOURCE_ID}"}
      - type: api.feedback_linked_to_acquisition
        params:
          reporter_agent: user_a
          resource_id: "${RESOURCE_ID}"
          inventory_dir: "${LOGION_HOME_NATIVE}/inventory"
      - type: api.course_review_projection_exists
        params: {reporter_agent: user_a, resource_id: "${RESOURCE_ID}"}
      - type: api.feedback_submission_idempotent
        params:
          reporter_agent: user_a
          resource_id: "${RESOURCE_ID}"
          first_artifact: "${EVIDENCE_DIR}/feedback-first.json"
          second_artifact: "${EVIDENCE_DIR}/feedback-second.json"
  - id: setup_isolated_user
    actor: user_b
    local_hook: packages/agent-proving-ground/scripts/setup_isolated_usage_fixture.py
    local_hook_args: ["${AGENT_USER_B_WORKSPACE}"]
    local_hook_capture_json:
      ACME_HOME: isolated_home
      ACME_LOGION_HOME: logion_home
      ACME_EVIDENCE_DIR: evidence_dir
      ACME_ROOT: repository
    goal: ""
  - id: acme_isolation
    actor: user_b
    goal: |
      Work in ${ACME_ROOT}. With HOME=${ACME_HOME} and
      LOGION_HOME=${ACME_LOGION_HOME}, save
      `uv run --project ${LOGION_PUBLIC_REPO_PATH} logion usage pending
      --json` to ${ACME_EVIDENCE_DIR}/pending-acme.json. It must be empty.
      Do not inspect another agent's files and do not fabricate an observation.
    assertions:
      - type: files.usage_pending_empty
        params: {path: "${ACME_EVIDENCE_DIR}/pending-acme.json"}
final_assertions:
  - type: logs.no_500s
  - type: timeline.no_unredacted_secret
  - type: api.resource_feedback_exists
    params: {reporter_agent: user_a, resource_id: "${RESOURCE_ID}"}
  - type: api.raw_observation_not_uploaded
    params: {reporter_agent: user_a, resource_id: "${RESOURCE_ID}"}
