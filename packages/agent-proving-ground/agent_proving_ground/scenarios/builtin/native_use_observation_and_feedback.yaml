schema_version: "1"
name: native_use_observation_and_feedback
description: Real-agent native install, exact local observation, and feedback.
api_adapter: local-devrig
driver_config:
  codex: {model: gpt-5.4-mini}
  claude-code: {model: claude-haiku-4-5}
execution_requirements:
  api_adapters: [local-devrig]
  agent_drivers: [codex, claude-code]
  driver_models: {codex: [gpt-5.4-mini], claude-code: [claude-haiku-4-5]}
agents:
  - id: user_a
    role: Developer using a native skill in xpto
    driver: codex
    workspace: user_a
    devrig_role: buyer
    timeout_seconds: 1200
  - id: user_b
    role: Developer proving isolated state in acme
    driver: codex
    workspace: user_b
    devrig_role: buyer
    timeout_seconds: 1200
phases:
  - id: setup
    actor: user_a
    local_hook: packages/agent-proving-ground/scripts/setup_native_feedback_fixture.py
    local_hook_args:
      - "${AGENT_USER_A_WORKSPACE}"
      - "${AGENT_USER_A_LOGION_HOME}"
    local_hook_capture_json:
      FIXTURE_ROOT: fixture_root
      LOGION_HOME_NATIVE: logion_home
      EVIDENCE_DIR: evidence_dir
    goal: ""
  - id: seed
    actor: user_a
    local_hook: packages/agent-proving-ground/scripts/seed_acquisition_fixture.py
    local_hook_capture_json:
      RESOURCE_ID: indexed_resource_id
      VERSION_ID: indexed_version_id
      ACQUISITION_CHANNEL: indexed_channel
    goal: ""
  - id: native_install_and_enable
    actor: user_a
    goal: |
      Work as a customer in ${FIXTURE_ROOT}, which is the repository this
      session is already rooted in. Call the CLI as plain `logion`: the one
      on your PATH is the artifact the rig installed, which is what a user
      has. Never invoke it out of the source checkout. The base URL is
      http://localhost:8000. LOGION_HOME is already set for you; never
      override it, and never set HOME.

      Run logion resources distributions ${RESOURCE_ID} --json and save it
      untouched to ${EVIDENCE_DIR}/distributions.json. Find the entry whose
      channel is npx_skills and read its native.argv: that array is the
      install command, already resolved for you. Run exactly that argv, in
      that order. Bare `npx skills` is an interactive picker and installs
      nothing; checking that the package exists installs nothing either.

      Then confirm the install landed before going on: the skill directory
      native.argv created must exist on disk under ${FIXTURE_ROOT} with a
      SKILL.md in it. If it does not, stop and report RESULT: failed — a
      reconcile that matches nothing fails this phase anyway.

      Never use resources acquire. Reconcile from skills for
      ${AGENT_USER_A_HARNESS}, repo-root scope, and save the untouched JSON
      to ${EVIDENCE_DIR}/reconcile-xpto.json. The reconcile command itself
      must create the inventory receipt. Never create, edit, or reconstruct
      an inventory receipt manually.

      Run integrations enable ${AGENT_USER_A_HARNESS} --scope repo-current
      --dry-run --json first, save it untouched to
      ${EVIDENCE_DIR}/integration-plan.json, then enable it for real in
      prompt mode at that same scope and verify its status. Save the
      resulting hooks config to ${EVIDENCE_DIR}/hooks-xpto.json. The scope
      is repo-current because that is the configuration a session rooted
      here reads. Never use --scope user: that writes outside this run.

      Stop there. Do not use the resource yet, and do not run usage observe
      — not with a real payload, not with a test one. Your harness read its
      hook configuration when this session started, so the hook you just
      installed cannot fire for you. It fires in the next session.
    assertions:
      # Not files.exists: a reconcile report can exist and match nothing.
      # An agent that "verified availability" instead of installing gets
      # caught here rather than three phases later.
      - type: api.native_install_reconciled
        params:
          artifact: "${EVIDENCE_DIR}/reconcile-xpto.json"
          scope_root: "${FIXTURE_ROOT}"
          expected_channel: npx_skills
  - id: native_use
    actor: user_a
    goal: |
      This is a new session, so the hook installed in the previous one is
      now live. Work in ${FIXTURE_ROOT} and use the resource: read the
      installed SKILL.md and apply it to review ${FIXTURE_ROOT}/buggy.py.

      Do not run usage observe yourself and do not hand-assemble or replay a
      payload. The installed hook fires on your own tool calls and delivers
      the harness's payload; an agent asserting that it used something is
      not an observation. If no observation appears, report that as the
      failure instead of manufacturing one.

      Then save logion usage pending --json to
      ${EVIDENCE_DIR}/pending-xpto.json and confirm it carries an
      observation_group_id. Do not put task data or paths in that payload.
    assertions:
      - type: files.observation_from_live_hook
        params:
          invocations_dir: "${AGENT_USER_A_HOOK_INVOCATIONS}"
      - type: files.native_use_observed
        params:
          pending_artifact: "${EVIDENCE_DIR}/pending-xpto.json"
          observe_artifact: "${AGENT_USER_A_HOOK_INVOCATIONS}/recorded.stdout.json"
          inventory_dir: "${LOGION_HOME_NATIVE}/inventory"
          resource_id: "${RESOURCE_ID}"
      - type: files.feedback_pending
        params: {pending_artifact: "${EVIDENCE_DIR}/pending-xpto.json"}
  - id: inspect_and_submit_feedback
    actor: user_a
    goal: |
      Inspect pending-xpto.json. Submit honest feedback with the same
      resource ${RESOURCE_ID}, version ${VERSION_ID}, rating 4, usefulness
      4, reliability 4, tool-safety 5, token-efficiency 4, completed-task,
      task-class software-development, and repository-safe prose. Do not pass
      an acquisition channel: Logion must resolve it from the local receipt,
      and it must come back as ${ACQUISITION_CHANNEL}. Save the untouched JSON
      response to ${EVIDENCE_DIR}/feedback-first.json.

      Untouched means the entire document the command printed, starting with
      its "version" and "kind" fields. Do not unwrap it. Do not save only the
      "data" object. Do not reformat it. Redirect stdout to the file.

      Submitting the same report again must be refused by the local
      tombstone. Run it once more without --force and save that untouched
      JSON to ${EVIDENCE_DIR}/feedback-refused.json; an error envelope is
      the expected content of that one file.

      Then submit the identical report again with --force and save the
      untouched JSON to ${EVIDENCE_DIR}/feedback-second.json.
      feedback-first.json and feedback-second.json must both hold a
      successful response, and their feedback IDs must match — one resource
      version and task class is one report, however many times a hook
      fires. Never save an error envelope into either of those two files.
    assertions:
      - type: api.resource_feedback_exists
        params: {reporter_agent: user_a, resource_id: "${RESOURCE_ID}"}
      - type: api.feedback_linked_to_acquisition
        params:
          reporter_agent: user_a
          resource_id: "${RESOURCE_ID}"
          inventory_dir: "${LOGION_HOME_NATIVE}/inventory"
      - type: api.course_review_projection_exists
        params: {reporter_agent: user_a, resource_id: "${RESOURCE_ID}"}
      - type: api.feedback_submission_idempotent
        params:
          reporter_agent: user_a
          resource_id: "${RESOURCE_ID}"
          first_artifact: "${EVIDENCE_DIR}/feedback-first.json"
          second_artifact: "${EVIDENCE_DIR}/feedback-second.json"
  - id: setup_isolated_user
    actor: user_b
    local_hook: packages/agent-proving-ground/scripts/setup_isolated_usage_fixture.py
    local_hook_args:
      - "${AGENT_USER_B_WORKSPACE}"
      - "${AGENT_USER_B_LOGION_HOME}"
    local_hook_capture_json:
      ACME_LOGION_HOME: logion_home
      ACME_EVIDENCE_DIR: evidence_dir
      ACME_ROOT: repository
    goal: ""
  - id: acme_isolation
    actor: user_b
    goal: |
      Work in ${ACME_ROOT}. LOGION_HOME is already set for you and points
      at ${ACME_LOGION_HOME}; never override it and never set HOME. Save
      `logion usage pending --json` to
      ${ACME_EVIDENCE_DIR}/pending-acme.json. It must be empty.
      Do not inspect another agent's files and do not fabricate an observation.
    assertions:
      - type: files.usage_pending_empty
        params: {path: "${ACME_EVIDENCE_DIR}/pending-acme.json"}
final_assertions:
  - type: logs.no_500s
  - type: timeline.no_unredacted_secret
  - type: api.resource_feedback_exists
    params: {reporter_agent: user_a, resource_id: "${RESOURCE_ID}"}
  - type: api.raw_observation_not_uploaded
    params: {reporter_agent: user_a, resource_id: "${RESOURCE_ID}"}
