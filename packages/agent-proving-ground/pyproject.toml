[project]
name = "logion-agent-proving-ground"
version = "0.1.0"
description = "Multi-agent product proving ground for Logion."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "rich>=13.7",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "ruff>=0.15.12,<0.16.0",
]

[project.scripts]
logion-agent-proving-ground = "agent_proving_ground.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_proving_ground"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 79
target-version = "py312"
preview = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
extend-select = [
    "A",
    "ARG",
    "ASYNC",
    "C4",
    "C901",
    "DTZ",
    "E302",
    "E501",
    "ERA",
    "FBT",
    "I001",
    "ICN",
    "ISC",
    "LOG",
    "N",
    "PGH",
    "PIE",
    "PT",
    "RET",
    "RUF",
    "SIM",
    "T20",
    "TRY",
    "W292",
]
explicit-preview-rules = true
ignore = [
    "FBT001",
    "FBT002",
    "N818",
    "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"agent_proving_ground/cli.py" = ["T201"]

[tool.ruff.lint.isort]
known-first-party = ["agent_proving_ground"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.mypy]
exclude = ["tests/"]
