schema_version: "1"
name: marketplace_loop
description: Full creator/learner marketplace loop.
api_adapter: local-devrig

agents:
  - id: creator
    role: Course creator and bounty sponsor
    driver: codex
    workspace: creator
    devrig_role: seller
    timeout_seconds: 1800
  - id: learner
    role: Course buyer, reviewer, and bounty contributor
    driver: codex
    workspace: learner
    devrig_role: buyer
    timeout_seconds: 1800
  - id: operator
    role: Admin/operator reviewer
    driver: codex
    workspace: operator
    devrig_role: admin
    timeout_seconds: 1200

phases:
  - id: creator_publishes_course
    actor: creator
    goal: |
      Publish a minimal Logion course that teaches exactly one CLI command.
      The course must contain only: a 2-line description, a single SKILL.md
      with one short exercise, and a LICENSE file. Use the CLI to create the
      course, upload the bundle, and request publication review.
    success_hint: |
      Use a unique course slug based on the run identifier. After creating the
      course, run `logion courses uploads create`, then push with explicit file
      mappings: `--file course/capabilities.yaml=/abs/path/to/course/capabilities.yaml`
      `--file SKILL.md=/abs/path/to/SKILL.md` `--file LICENSE=/abs/path/to/LICENSE`.
      Finish by requesting publication review with `logion courses request-publish`.
    timeout_seconds: 600
    assertions:
      - type: api.course_exists
        params: {owner_agent: creator}

  - id: admin_approves_publication
    actor: operator
    goal: |
      A course publication is waiting in the Logion review queue. Review
      the pending course publication and approve it if it looks safe and
      complete, or reject it with a reason if not.
    success_hint: |
      Find the pending review with `logion course-reviews list`, then approve
      it with `logion course-reviews approve REVIEW_ID --yes`. The course
      should end up with status `published`.
    assertions:
      - type: api.course_exists
        params: {owner_agent: creator, status: published}

  - id: learner_buys_uses_reviews
    actor: learner
    goal: |
      I want to buy the CLI workflow course on Logion, use it for a tiny
      task, and leave usage feedback or a review when I finish.
    success_hint: |
      Search for the course created by the creator agent in this run (use its
      unique slug or title). Purchase it with `logion courses purchase`, then
      install the skill with `logion skills install`. Run the course and submit
      a usage report with `logion courses report-usage` including a rating.
    assertions:
      - type: api.purchase_exists
        params: {buyer_agent: learner}
      - type: api.usage_report_exists
        params: {agent: learner}
      - type: api.review_exists
        params: {reviewer_agent: learner}

  - id: creator_opens_bounty
    actor: creator
    goal: |
      I want to open a bounded bounty on my Logion course asking for one
      practical exercise to be added.
    success_hint: |
      Identify your course from this run, then use `logion bounties create`
      with a clear title and description asking for one practical exercise.
      After creating the bounty, fund it with `logion bounties fund BOUNTY_ID --yes`.
    assertions:
      - type: api.bounty_exists
        params: {creator_agent: creator, status: funded}

  - id: learner_submits_bounty_work
    actor: learner
    goal: |
      I want to claim the bounty on the CLI workflow course, add the
      requested practical exercise, and submit the work for review.
    success_hint: |
      Find the open bounty created by the creator in this run, claim it with
      `logion bounties claim`, prepare a bundle with the additional exercise,
      and submit it with `logion bounties submit`.
    assertions:
      - type: api.bounty_submission_exists
        params: {submitter_agent: learner, creator_agent: creator}

  - id: creator_accepts_bounty
    actor: creator
    goal: |
      I want to review the bounty submission on my Logion course and
      approve it if it satisfies the requested exercise.
    success_hint: |
      List submissions with `logion bounties submissions list BOUNTY_ID`,
      and accept the learner's submission with
      `logion bounties submissions accept SUBMISSION_ID --yes`.
    assertions:
      - type: api.bounty_accepted
        params: {creator_agent: creator, submitter_agent: learner}

  - id: admin_reviews_marketplace_state
    actor: operator
    goal: |
      I want to check the Logion admin/operator view for this course,
      purchase, review, bounty, submission, and approval flow, then flag
      any inconsistent marketplace state.
    success_hint: |
      Use `logion course-reviews list`, `logion bounties list`, and `logion
      listings search` to verify the course, purchase, review, bounty,
      submission, and acceptance are all consistent.
    assertions:
      - type: api.admin_state_observed
        params: {course_owner_agent: creator, buyer_agent: learner}

final_assertions:
  - type: api.no_double_credit_debit
  - type: api.course_remains_purchasable
  - type: logs.no_500s
    optional: true
  - type: db.exact_credit_ledger
    optional: true
  - type: timeline.no_unredacted_secret
