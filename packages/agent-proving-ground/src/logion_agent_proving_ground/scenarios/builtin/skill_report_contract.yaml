schema_version: "1"
name: skill_report_contract
description: Agent uses a course and must report usage afterward.
api_adapter: mock

agents:
  - id: learner
    role: Learner using a Logion course
    driver: scripted
    workspace: learner

phases:
  - id: use_course_and_report
    actor: learner
    goal: |
      Install/use the fixture course for a tiny task. When done, follow the
      Logion companion rule and file usage feedback for the exact course and
      version you used.
    assertions:
      - type: api.course_exists
        params: {status: published}
      - type: api.usage_report_exists
        params: {agent: learner}

final_assertions:
  - type: timeline.no_unredacted_secret
