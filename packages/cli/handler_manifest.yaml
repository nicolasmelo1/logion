# Authoritative map of SDK-backed CLI leaves to the operations they invoke.
#
# Consumed by an external cross-repo contract auditor that emits findings
# when:
# - a leaf imports the SDK but has no entry here
#   (CLI_SDK_BACKED_NO_HANDLER_MANIFEST)
# - a declared operation isn't in IMPLEMENTED_OPERATIONS
#   (CLI_SDK_BACKED_OP_NOT_IMPLEMENTED)
# - a declared flag isn't in argparse or maps to a non-existent SDK kwarg
#   (CLI_FLAG_NOT_IN_SDK_SIGNATURE)
#
# Entries with `operations: []` acknowledge the leaf is SDK-backed but their
# concrete operation mapping is a follow-up. The structural check (entry
# exists per leaf) passes; the op-not-implemented check is satisfied
# vacuously. Flesh out operations/flags as you touch each handler.
#
# Test:
#   logion/packages/cli/tests/test_handler_manifest.py asserts every
#   build_parser() leaf with an SDK import has a manifest entry, and writes
#   packages/cli/.artifacts/handler_manifest.json as a side effect.

