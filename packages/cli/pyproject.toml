[project]
name = "logion-cli"
version = "0.1.0"
description = "Logion CLI for AI agents and marketplace operators."
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Logion contributors" }]
keywords = ["logion", "marketplace", "agent", "skill", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "logion-client",
    "pydantic>=2.7,<3.0.0",
    "pyyaml>=6.0,<7.0",
]

[project.urls]
Homepage = "https://github.com/nicolasmelo1/logion"
Repository = "https://github.com/nicolasmelo1/logion"
Issues = "https://github.com/nicolasmelo1/logion/issues"
Documentation = "https://github.com/nicolasmelo1/logion#readme"
Changelog = "https://github.com/nicolasmelo1/logion/releases"

[project.optional-dependencies]
recall = ["rapidfuzz>=3.9,<4.0"]

[tool.uv.sources]
logion-client = { workspace = true }

[project.scripts]
logion = "cli.main:main"
lgn = "cli.main:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3,<9.1.0",
    "rapidfuzz>=3.9,<4.0",
    "ruff>=0.15.12,<0.16.0",
    "types-PyYAML>=6.0,<7.0",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "cli"

[tool.ruff]
line-length = 79
target-version = "py312"
preview = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
extend-select = [
    "A",
    "ARG",
    "ASYNC",
    "C4",
    "C901",
    "DTZ",
    "E302",
    "E501",
    "ERA",
    "FBT",
    "I001",
    "ICN",
    "ISC",
    "LOG",
    "N",
    "PIE",
    "PT",
    "RET",
    "RUF",
    "SIM",
    "T20",
    "TRY",
    "W292",
]
explicit-preview-rules = true
ignore = [
    "FBT001",
    "FBT002",
    "N818",
    "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"cli/_errors.py" = ["T201"]
"cli/_output.py" = ["T201"]
"cli/commands/courses/capabilities.py" = ["T201"]
"cli/commands/courses/taxonomy_handler.py" = ["T201"]
"cli/commands/reports/handlers.py" = ["T201"]
"cli/commands/notifications/handlers.py" = ["T201"]
"cli/commands/skills/handlers.py" = ["T201"]
"cli/commands/skills/_query_handlers.py" = ["T201"]
"cli/commands/skills/_install_helpers.py" = ["T201"]
"cli/commands/skills/_finalize.py" = ["T201"]
"cli/commands/skills/_update_handler.py" = ["T201"]
"cli/commands/skills/_verify_handler.py" = ["T201"]
"cli/commands/skills/_inspect_handler.py" = ["T201"]
"cli/commands/skills/_search_handler.py" = ["T201"]
"cli/commands/courses/_uploads_push.py" = ["T201"]
"cli/commands/docs/handlers.py" = ["T201"]
"cli/commands/recall/handlers.py" = ["T201"]
"scripts/record_workflow.py" = ["T201"]
"scripts/sync_docs.py" = ["T201"]

[tool.ruff.lint.isort]
known-first-party = ["cli", "landing", "logion"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.mypy]
exclude = ["tests/"]

[tool.semantic_release]
build_command = "uv run python packages/cli/scripts/sync_docs.py && uv build"
commit_message = """\
chore(release): logion-cli@{version} [skip ci]

Automatically generated by python-semantic-release
"""
commit_parser = "conventional"
tag_format = "logion-cli-v{version}"
version_toml = ["pyproject.toml:project.version"]
version_variables = ["cli/_version.py:__version__"]
upload_to_pypi = false
upload_to_release = false

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.branches."rc/*"]
match = "rc/.*"
prerelease = true
prerelease_token = "rc"

[tool.semantic_release.commit_parser_options]
path_filters = ["packages/cli/"]
allowed_tags = ["feat", "fix", "perf", "refactor", "chore", "docs", "test", "build", "ci"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.semantic_release.changelog]
mode = "update"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"
