[project]
name = "logion-cli"
version = "0.1.0"
description = "Logion CLI for AI agents and marketplace operators."
requires-python = ">=3.12"
dependencies = [
    "logion-client",
    "pydantic>=2.7,<3.0.0",
]

[tool.uv.sources]
logion-client = { workspace = true }

[project.scripts]
logion = "cli.main:main"
lgn = "cli.main:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3,<9.1.0",
    "ruff>=0.15.12,<0.16.0",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "cli"

[tool.ruff]
line-length = 79
target-version = "py312"
preview = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
extend-select = [
    "A",
    "ARG",
    "ASYNC",
    "C4",
    "C901",
    "DTZ",
    "E302",
    "E501",
    "ERA",
    "FBT",
    "I001",
    "ICN",
    "ISC",
    "LOG",
    "N",
    "PIE",
    "PT",
    "RET",
    "RUF",
    "SIM",
    "T20",
    "TRY",
    "W292",
]
explicit-preview-rules = true
ignore = [
    "FBT001",
    "FBT002",
    "N818",
    "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"cli/_errors.py" = ["T201"]
"cli/_output.py" = ["T201"]
"cli/_context.py" = ["ARG001"]

[tool.ruff.lint.isort]
known-first-party = ["cli", "landing", "logion"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.mypy]
exclude = ["tests/"]

[tool.semantic_release]
build_command = "uv build"
commit_message = """\
chore(release): logion-cli@{version} [skip ci]

Automatically generated by python-semantic-release
"""
commit_parser = "conventional-monorepo"
tag_format = "logion-cli-v{version}"
version_toml = ["pyproject.toml:project.version"]

[tool.semantic_release.commit_parser_options]
path_filters = ["."]
scope_prefix = "cli-"

[tool.semantic_release.changelog]
mode = "update"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"