[project]
name = "logion-indexer"
version = "0.1.0"
description = "External skillhub indexer for Logion: crawl, resolve, dedup, push."
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Logion contributors" }]
keywords = ["logion", "indexer", "skillhub", "crawler"]
dependencies = [
    "logion-skillmap",
    "pyyaml>=6.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]

[project.scripts]
logion-indexer = "logion_indexer.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3,<9.1.0",
    "ruff>=0.15.12,<0.16.0",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
logion-skillmap = { workspace = true }

[tool.uv.build-backend]
module-root = ""
module-name = "logion_indexer"

[tool.ruff]
line-length = 79
target-version = "py311"
preview = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
extend-select = [
    "A",
    "ANN401",
    "ARG",
    "ASYNC",
    "C4",
    "C901",
    "DTZ",
    "E302",
    "E501",
    "ERA",
    "FBT",
    "I001",
    "ICN",
    "ISC",
    "LOG",
    "N",
    "PGH",
    "PIE",
    "PT",
    "RET",
    "RUF",
    "SIM",
    "T20",
    "TID251",
    "TRY",
    "W292",
]
explicit-preview-rules = true
ignore = [
    "FBT001",
    "FBT002",
    "N818",
    "TRY003",
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Repo-wide ban on `typing.Any`. Banning the *import* is what makes it
# stick: it kills `dict[str, Any]`, `list[Any]`, `-> Any` and bare
# `x: Any` in one rule, instead of only the top-level annotations
# ANN401 can see.
"typing.Any" = { msg = "Use a TypedDict/dataclass for a known shape, JsonValue/JsonObject from the package's _json module at a JSON boundary, or a TypeVar for generic passthrough. If a third-party stub genuinely forces Any, add a narrow per-file-ignore for TID251 with a comment saying why." }

[tool.ruff.lint.isort]
known-first-party = ["logion_indexer"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.per-file-ignores]
# UP040 wants the PEP 695 `type` keyword (3.12+); the JSON module
# is shared with packages published on a >=3.11 floor.
"**/_json.py" = ["UP040"]
# CLI module prints to stdout — that's its primary UI.
"logion_indexer/cli.py" = ["T201"]

[tool.mypy]
exclude = ["tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]