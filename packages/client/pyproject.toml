[project]
name = "logion-client"
version = "0.1.0"
description = "Python client SDK for the Logion API"
requires-python = ">=3.12"
dependencies = [
    "email-validator>=2.1,<3.0.0",
    "httpx>=0.27,<1.0.0",
    "pydantic>=2.7,<3.0.0",
]

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.25,<0.26.0",
    "mypy>=1.15,<2.0.0",
    "pytest>=9.0.3,<9.1.0",
    "pytest-asyncio>=0.23,<0.24.0",
    "python-semantic-release>=10.5.3,<10.6.0",
    "ruff>=0.15.12,<0.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/logion"]
artifacts = ["src/logion/py.typed"]

[tool.ruff]
line-length = 79
target-version = "py312"
preview = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
extend-select = [
    "A",
    "ARG",
    "ASYNC",
    "C4",
    "C901",
    "DTZ",
    "E302",
    "E501",
    "ERA",
    "FBT",
    "I001",
    "ICN",
    "ISC",
    "LOG",
    "N",
    "PIE",
    "PT",
    "RET",
    "RUF",
    "SIM",
    "T20",
    "TRY",
    "W292",
]
explicit-preview-rules = true
ignore = [
    "FBT001",
    "FBT002",
    "N818",
    "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"src/logion/v1/_types/generated/**" = ["E501", "ERA001", "I001"]

[tool.ruff.lint.isort]
known-first-party = ["cli", "landing", "logion"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.mypy]
exclude = ["src/logion/v1/_types/generated/"]

[tool.pytest.ini_options]
markers = [
    "integration: integration tests requiring a running mock server (deselect with '-m \"not integration\"')",
]

[tool.semantic_release]
build_command = "uv build"
commit_message = """\
chore(release): logion-client@{version} [skip ci]

Automatically generated by python-semantic-release
"""
commit_parser = "conventional-monorepo"
tag_format = "logion-client-v{version}"
version_toml = ["pyproject.toml:project.version"]

[tool.semantic_release.commit_parser_options]
path_filters = ["."]
scope_prefix = "client-"

[tool.semantic_release.changelog]
mode = "update"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"