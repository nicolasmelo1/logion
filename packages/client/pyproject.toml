[project]
name = "logion-client"
version = "0.1.15"
description = "Python client SDK for the Logion API"
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Logion contributors" }]
keywords = ["logion", "marketplace", "agent", "sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "email-validator>=2.1,<3.0.0",
    "httpx>=0.27,<1.0.0",
    "pydantic>=2.7,<3.0.0",
]

[project.urls]
Homepage = "https://github.com/nicolasmelo1/logion"
Repository = "https://github.com/nicolasmelo1/logion"
Issues = "https://github.com/nicolasmelo1/logion/issues"
Documentation = "https://github.com/nicolasmelo1/logion#readme"
Changelog = "https://github.com/nicolasmelo1/logion/releases"

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.64,<0.65.0",
    "mypy>=1.15,<2.0.0",
    "pytest>=9.0.3,<9.1.0",
    "python-semantic-release>=10.6.1,<10.7.0",
    "ruff>=0.15.12,<0.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/logion"]
artifacts = ["src/logion/py.typed"]

[tool.ruff]
line-length = 79
target-version = "py312"
preview = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
extend-select = [
    "A",
    "ANN401",
    "ARG",
    "ASYNC",
    "C4",
    "C901",
    "DTZ",
    "E302",
    "E501",
    "ERA",
    "FBT",
    "I001",
    "ICN",
    "ISC",
    "LOG",
    "N",
    "PIE",
    "PT",
    "RET",
    "RUF",
    "SIM",
    "T20",
    "TID251",
    "TRY",
    "W292",
]
explicit-preview-rules = true
ignore = [
    "FBT001",
    "FBT002",
    "N818",
    "TRY003",
]

[tool.ruff.lint.per-file-ignores]
# UP040 wants the PEP 695 `type` keyword (3.12+); the JSON module
# is shared with packages published on a >=3.11 floor.
"**/_json.py" = ["UP040"]
"src/logion/v1/_types/generated/**" = ["ALL"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Repo-wide ban on `typing.Any`. Banning the *import* is what makes it
# stick: it kills `dict[str, Any]`, `list[Any]`, `-> Any` and bare
# `x: Any` in one rule, instead of only the top-level annotations
# ANN401 can see.
"typing.Any" = { msg = "Use a TypedDict/dataclass for a known shape, JsonValue/JsonObject from the package's _json module at a JSON boundary, or a TypeVar for generic passthrough. If a third-party stub genuinely forces Any, add a narrow per-file-ignore for TID251 with a comment saying why." }

[tool.ruff.lint.isort]
known-first-party = ["cli", "landing", "logion"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.mypy]
exclude = ["src/logion/v1/_types/generated/"]

[tool.pytest.ini_options]
markers = [
    "integration: integration tests requiring a running mock server (deselect with '-m \"not integration\"')",
]

[tool.semantic_release]
build_command = "uv build"
commit_message = """\
chore(release): logion-client@{version} [skip ci]

Automatically generated by python-semantic-release
"""
commit_parser = "conventional"
tag_format = "logion-client-v{version}"
version_toml = ["pyproject.toml:project.version"]
version_variables = ["src/logion/_version.py:__version__"]
upload_to_pypi = false
upload_to_release = false

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.branches."rc/*"]
match = "rc/.*"
prerelease = true
prerelease_token = "rc"

[tool.semantic_release.commit_parser_options]
path_filters = ["packages/client/"]
allowed_tags = ["feat", "fix", "perf", "refactor", "chore", "docs", "test", "build", "ci"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.semantic_release.changelog]
mode = "update"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"