[project]
name = "logion-client"
version = "0.1.0"
description = "Python client SDK for the Logion API"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
]

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.25",
    "mypy>=1.15,<2",
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23",
    "ruff>=0.15.12,<0.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/logion"]

[tool.ruff]
line-length = 79
target-version = "py312"
preview = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
extend-select = [
    "A",
    "ARG",
    "ASYNC",
    "C4",
    "C901",
    "DTZ",
    "E302",
    "E501",
    "ERA",
    "FBT",
    "I001",
    "ICN",
    "ISC",
    "LOG",
    "N",
    "PIE",
    "PT",
    "RET",
    "RUF",
    "SIM",
    "T20",
    "TRY",
    "W292",
]
explicit-preview-rules = true
ignore = [
    "FBT001",
    "FBT002",
    "N818",
    "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"src/logion/v1/_types/generated/**" = ["E501", "ERA001", "I001"]

[tool.ruff.lint.isort]
known-first-party = ["logion"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.mypy]
exclude = ["src/logion/v1/_types/generated/"]

[tool.pytest.ini_options]
markers = [
    "integration: integration tests requiring a running mock server (deselect with '-m \"not integration\"')",
]