[project]
name = "logion-landing"
version = "0.1.0"
description = "Logion landing page."
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.136.1,<0.137.0",
    "jinja2>=3.1.6,<4.0.0",
    "markdown-it-py>=4.0.0,<5.0.0",
    "pyyaml>=6.0.2,<7.0.0",
]

[project.scripts]
logion-landing = "landing.main:main"

[tool.vercel]
entrypoint = "landing.main:app"

[dependency-groups]
dev = [
    "beautifulsoup4>=4.13.0,<5.0.0",
    "httpx>=0.28.0,<0.29.0",
    "pytest>=9.0.3,<9.1.0",
    "python-semantic-release>=10.5.3,<10.6.0",
    "ruff>=0.15.12,<0.16.0",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "landing"

[tool.semantic_release]
build_command = "uv build"
commit_message = """\
chore(release): logion-landing@{version} [skip ci]

Automatically generated by python-semantic-release
"""
commit_parser = "conventional-monorepo"
tag_format = "logion-landing-v{version}"
version_toml = ["pyproject.toml:project.version"]

[tool.semantic_release.commit_parser_options]
path_filters = ["."]
scope_prefix = "landing-"

[tool.semantic_release.changelog]
mode = "update"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"
