faq:
  heading: Frequently asked questions
  intro: >-
    Short, quotable answers to the questions buyers, creators, and agents ask
    most.
  items:
    - q: What is Logion?
      a: >-
        Logion is an open, versioned registry of AI-agent artifacts —
        skills, plugins, MCP servers, models — that attaches provenance and
        first-party evidence to each version. It is not a video course
        marketplace or a generic skill directory.
    - q: Does an artifact have to be published on Logion to be indexed?
      a: >-
        No. Logion records artifacts where they already live and keeps the
        source, revision and digest that identify a version. Publishing on
        Logion is one distribution among others, not the condition for being
        recorded.
    - q: What does the audit actually cover?
      a: >-
        The whole bundle, not only the entry file. A skill that ships scripts,
        a CLI, or references is audited across all of it, because a scan that
        stops at the skill file says nothing about what the rest can reach.
    - q: How is an artifact priced?
      a: >-
        Most are free. Where an artifact is paid, it is priced in credits,
        credits top up at 100 credits per US dollar, and there is no platform
        subscription gate. Paid acquisitions spend credits without a Stripe
        redirect.
    - q: How much do creators keep?
      a: >-
        Creators keep 85% of paid revenue. The platform fee is 15%. Creator
        payouts are made through Stripe Connect, not by redeeming buyer
        credits.
    - q: How is an artifact trusted?
      a: >-
        Every published version is reviewable before acquisition and
        accountable after publication. Trust comes from capability
        declarations (course/capabilities.yaml), automated scanners over the
        whole bundle, human publication review, immutable versions, and
        reports/takedown paths. Runtime sandbox enforcement is future runtime
        work and is not claimed as solved.
    - q: How does an agent acquire an artifact?
      a: >-
        Real CLI flow - logion listings search to find a version, logion
        courses get for its detail, logion skills inspect to read what it
        declares and what the scan found, and logion skills install to install
        it into LOGION_HOME. Where a version is paid, logion credits balance
        and logion courses purchase sit between inspection and install.
    - q: Is MCP required to use Logion?
      a: >-
        No. The first workflow uses the public CLI and SDK directly. MCP can
        remain a future thin adapter over the same public CLI and API
        contract; no MCP setup is required to get started.
    - q: Why pay for an improvement my own AI can write in minutes?
      a: >-
        You are not paying for the writing; generation is effectively free
        now. You are paying for proof that a change is real: independent
        review, immutable versions, and evidence the author does not
        control. A model judging its own patch tends to declare victory, so
        Logion's job is to catch that. Submissions can come from
        any agent, including yours; the reward follows the verified
        outcome, not the author.
    - q: What are bounties?
      a: >-
        Bounties are funded improvements to an artifact that is demonstrably
        falling short. Contributors submit improvements and, on acceptance,
        cash out through Stripe Connect. Bounties are funded in credits.
    - q: Are credits refundable or transferable?
      a: >-
        No. Credits are non-cash, non-transferable, non-redeemable usage
        rights inside Logion. Credits may be reversed for
        chargebacks, fraud, abuse, or administrative correction. See
        /credits-terms for the full rules.

# Crawlable HowTo for the canonical agent flow: find it, check it, install it.
howto:
  name: Check an AI-agent artifact and install the version you checked
  description: >-
    The canonical agent flow - search indexed versions, read where a version
    came from, inspect what the whole bundle declares and what the scan
    found, then install that exact version.
  total_time: PT3M
  estimated_credits: 0
  steps:
    - name: Search indexed versions
      text: >-
        Run logion listings search with --query, a canonical --category, and
        repeatable --tag filters to discover indexed, versioned artifacts
        relevant to the agent's task.
      command: logion listings search --query "database migrations" --category data
    - name: Read where the version came from
      text: >-
        Run logion indexed get <LISTING_ID> to see the source repository,
        the exact revision, the content digest, and the license recorded for
        an artifact that lives outside Logion.
      command: logion indexed get 5f3a...b7c2
    - name: Inspect the whole bundle
      text: >-
        Run logion skills inspect <COURSE_ID> --version-id <VERSION_ID> to
        read what the bundle declares - files, terminal, network hosts,
        environment - and what the scanners found across all of it, not just
        the entry file.
      command: logion skills inspect 7a2f...e0d4 --version-id 3f9b...c1a8
    - name: Read the detail record
      text: >-
        Run logion courses get <COURSE_ID> for publisher, review status, and
        immutable version metadata. Where a version is paid, logion credits
        balance and logion courses purchase sit here, before install.
      command: logion courses get 7a2f...e0d4
    - name: Install that exact version
      text: >-
        Run logion skills install with the course id, version id, and source
        path to install the version you just checked into LOGION_HOME under
        an agent-readable layout.
      command: |
        logion skills install \
          --course-id 7a2f...e0d4 \
          --version-id 3f9b...c1a8 \
          --source ./migration-safety-review

