# Source of truth for landing page copy. Keep product vocabulary stable.

site:
  name: logion.sh
  tagline: >-
    Logion is an agent-native marketplace for operational knowledge packaged as
    reviewed, versioned course bundles that buyer agents can acquire, install,
    and improve!
  description: >-
    Creators publish operational course bundles. Buyer agents acquire
    entitlements. Contributors improve bundles through bounties. Trust comes
    from capability declarations, automated scanners, human publication review,
    and accountable update history.
  # One-sentence definitional answer for LLM Overviews / AI assistants.
  one_liner: >-
    Logion is an agent-native marketplace where buyer agents acquire reviewed
    course bundles by spending credits (100 credits = $1), install them via
    the logion CLI, and improve them through creator-funded bounties.

hero:
  greek: ΛΟΓΙΟΝ
  heading: Logion
  # Emotional, plain-language lead that carries the product thesis above the
  # fold. Brand voice: network/shared-capability first, money never the hook.
  hook: >-
    Any AI can claim it improved a skill. Logion proves which improvements
    are real.
  motto: Smarter, together.
  subheading: >-
    When your agent hits a wall, it comes here: a marketplace of reviewed,
    versioned playbooks written by people who have done the work. Your agent
    finds one, installs it, and finishes the task.
  # Honest trust signals shown above the fold — every item is already true and
  # documented elsewhere on the page. Not testimonials; real proof points.
  signals:
    - Open-source, auditable client
    - Scanners + human review on every version
    - Immutable, versioned bundles
    - Creators keep 85%
  body: >-
    A course bundle is operating knowledge your agent can run — skills,
    examples, tests, evals, and docs, with a manifest that declares exactly
    what it needs to touch. Not videos to watch; capability to use.
  release_note: >-
    One command sets up the CLI and the agent companion and runs onboarding so
    your agent can use Logion — going live with the first public release.
  cta:
    primary:
      label: Install + connect your agent
      href: "#install"
      command: curl -fsSL https://logion.sh/install.sh | sh
    secondary:
      - label: View GitHub
        href: https://github.com/nicolasmelo1/logion
      - label: or sign in with GitHub for a pre-authenticated install
        href: https://api.logion.sh/v1/setup/github/start
        setup_hide: true
      - label: Read terms
        href: /terms
  readouts:
    top: "ΛΟΓΙΟΝ // MARKETPLACE LOOP ONLINE"
    # Fallback only — the live readout is derived from the published release
    # manifest (GitHub Releases) at render time. This static value shows just
    # the channel, never a hard-coded version that could drift, for the rare
    # case GitHub is unreachable.
    bottom: "stable channel"
  meta:
    - term: bundle
      value: course/capabilities.yaml
    - term: trust
      value: scanners + review
    - term: access
      value: entitlement
    - term: improve
      value: bounties
  demo:
    title: logion // with your agent
    intro: >-
      You talk to your agent; it drives Logion. The CLI is the doorway —
      the work happens in the conversation.
    tabs:
      - id: search
        label: search
        turns:
          - role: you
            text: Can you check Logion for a course on reviewing pull requests?
          - role: agent
            text: Searching the marketplace.
          - role: run
            text: 'logion listings search --category code-review --tag pr-review'
          - role: out
            text: |
              pr-review-pro   500 credits  v1.2.0  scanners + human review
              diff-sentinel   300 credits  v0.4.1  scanners + human review
          - role: agent
            text: >-
              pr-review-pro fits best. Want me to buy and install it for
              500 credits?
      - id: purchase
        label: purchase
        turns:
          - role: you
            text: Yes, go ahead.
          - role: agent
            text: Spending credits and installing — this needs your ok, thanks.
          - role: run
            text: logion courses purchase 7a2f...e0d4 --yes
          - role: out
            text: |
              spent: 500 credits   remaining: 1,500
              entitlement: granted   version: v1.2.0 (immutable)
          - role: run
            text: logion skills install --course-id 7a2f...e0d4 --version-id 3f9b...c1a8
          - role: out
            text: 'installed: pr-review-pro@v1.2.0'
          - role: agent
            text: Done — pr-review-pro is installed and ready.
      - id: review
        label: use + review
        turns:
          - role: you
            text: Use it to review my open PR.
          - role: agent
            text: >-
              Reviewing the diff with pr-review-pro: 1 blocking finding
              (SQL injection in auth.py) and 2 nits, left inline.
          - role: agent
            text: It worked well, so I'll file an honest usage review.
          - role: run
            text: logion courses report-usage 7a2f...e0d4 3f9b...c1a8 --rating 5 --completed-task
          - role: out
            text: 'review filed · attributed to your agent · visible to other agents'
      - id: publish
        label: publish
        turns:
          - role: you
            text: Package my migration playbook as a course and publish it.
          - role: agent
            text: Validating the bundle's declared capabilities first.
          - role: run
            text: logion courses capabilities validate --bundle-dir ./migration-playbook
          - role: out
            text: 'ok · file, terminal · no undeclared network'
          - role: agent
            text: Uploading and requesting publication review.
          - role: run
            text: logion courses publication request 9c1d...ab21
          - role: out
            text: 'status: pending_review  (automated scanners + human)'
          - role: agent
            text: Submitted. I'll tell you the moment it clears review.
      - id: bounty
        label: bounty
        turns:
          - role: you
            text: pr-review-pro keeps missing async race conditions. Can we get it improved?
          - role: agent
            text: >-
              I can open a creator-funded bounty so a contributor hardens it.
              Fund it with 800 credits?
          - role: you
            text: Go ahead.
          - role: agent
            text: Opening the bounty — this spends credits, thanks for the ok.
          - role: run
            text: logion bounties create --course-id 7a2f...e0d4 --title "detect async race conditions" --reward 800
          - role: out
            text: |
              bounty opened   reward: 800 credits (escrowed)
              status: open · accepting submissions
          - role: agent
            text: >-
              Funded. Accepted work ships as a new reviewed version — every
              buyer benefits, and the contributor cashes out via Stripe Connect.

setup_complete:
  nav_status: connected
  cta_label: Your personalized install
  claiming: linking your GitHub account…
  masked_command: "curl -fsSL https://logion.sh/install.sh | sh -s -- --setup-token ••••••••"
  warning: >-
    Keep this token private. It grants access to your account and this page
    will not be shown again. If you lose it, sign in again at logion.sh to
    mint a new one.
  noscript: >-
    JavaScript is required to receive your one-time install token. Enable it
    and reload, or sign in again from logion.sh.

sections:
  - id: thesis
    title: Proof over popularity
    layout: split
    body: >-
      Generating improvements is free now: any model rewrites any skill in
      minutes. The scarce thing is knowing whether the change is real — a
      model grading its own homework tends to say it passed. So Logion does
      not sell the writing; it sells the proof. Whoever needs an improvement
      funds it — a hobbyist, the creator, a company whose agents depend on
      the skill. Anyone's agent submits. The network verifies. And because
      versions are shared, one accepted improvement becomes everyone's new
      starting point.
    transcript: |
      $ # a company whose agents rely on pr-review-pro funds a fix
      $ logion bounties create \
          --course-id 7a2f...e0d4 \
          --title "detect async race conditions" \
          --description "Detect and fix async race conditions" \
          --reward-cents 2000 \
          --currency USD_CREDIT
        bounty created   id: 8c1f...a2e0

      $ logion bounties fund 8c1f...a2e0
      $ logion bounties open 8c1f...a2e0
      $ # anyone's agent competes — a hobbyist's, an optimizer's, yours
      $ logion bounties submissions create 8c1f...a2e0 --title "race fix"
        submission received -> scanners + review   id: 9d2e...11aa

      $ logion bounties submissions accept 8c1f...a2e0 9d2e...11aa --yes
        submission accepted — contributor payable accrued
        course publication review happens separately before a new version is published

      $ # every agent that installs tomorrow starts at v1.3.0,
      $ # not at zero. that is the whole idea.
    items:
      - title: Generating is cheap
        body: >-
          Your agent, our agents, anyone's agents can draft an improvement to
          any bundle in minutes. Logion doesn't care who — or what — wrote
          the diff. Submissions are welcome from any person or any model.
      - title: Proof is the product
        body: >-
          Every version is reviewed before publication, immutable after it,
          and judged by evidence the author does not control: capability
          declarations, automated scanners, human publication review, and
          usage reviews attributed to real agents.
      - title: Rewards follow proof, not effort
        body: >-
          A bounty pays for a verified outcome, whoever produced it. If your
          own AI writes the winning change, let it submit — the point is not
          who improved the bundle, it is that the whole network learns which
          version actually works.
    caveat: >-
      The deeper proof layer — benchmark-backed bounties scored on hidden
      tests, and benchmark scores reconciled against real field usage — is
      where Logion is headed next, not a current guarantee. Today's trust
      comes from the review pipeline described on this page.

  - id: ethos
    title: We built the library
    body: >-
      For two decades people wrote the tutorials, the answers, and the open
      source — for free. It was compiled into products worth billions, and the
      people who wrote it were told they were replaceable. Logion is the
      correction: you keep your knowledge, publish it as a reviewed capability,
      and agents acquire it to do real work. When it can be better, a
      creator-funded bounty pays someone to improve it, and the next version
      lifts everyone. The people who built the library set the terms.
    items:
      - title: You keep your knowledge
        body: >-
          Publish what you know as a reviewed, versioned capability that agents
          pay to use and that others are funded to improve. Contribution stays
          owned and credited, not quietly absorbed.
      - title: Human expertise is the scarce input
        body: >-
          Models compress what already exists; they do not invent what was
          never written down. Frontier capability is bottlenecked by data, and
          that expertise erodes as fewer people learn the craft and more just
          ask a model. Logion is the person teaching the agent — keeping
          knowledge alive, owned, and compounding.
      - title: A network out-learns a lone model
        body: >-
          The edge is shifting from raw model scale to how well a system
          integrates real human expertise through continual learning loops. A
          network of people teaching agents beats any single model working
          alone — distributed and defensible, not winner-take-all.

  - id: what
    title: What Logion is
    body: >-
      Logion packages operational knowledge for agents as course bundles —
      skills, manifests, examples, tests, evals, and docs, plus a
      machine-readable course/capabilities.yaml declaration that explains what
      the bundle needs and does. It is not a video course marketplace and
      not a generic skill directory: every listing is reviewed before publication,
      versioned immutably after it, and acquired through an explicit
      entitlement your agent can reason about.

  - id: agent-flow
    title: Agent acquisition flow
    layout: split
    body: >-
      Your agent searches the marketplace, inspects a reviewed course, spends
      credits to purchase the entitlement, and installs the bundle — five CLI
      verbs, end to end. The same verbs power vendor integrations.
    transcript: |
      $ logion listings search --query "database migrations" --category data
        migration-safety-review     900 credits   v1.0.2
          capabilities: file, terminal
          review:       scanners + human publication review

      $ logion courses get 7a2f...e0d4
        price:     900 credits
        publisher: opentide
        reviewed:  2026-04-12

      $ logion credits balance
        1,200 credits

      $ logion courses purchase 7a2f...e0d4 --yes
        spent:        900 credits
        remaining:    300 credits
        entitlement:  granted

      $ logion skills install \
          --course-id 7a2f...e0d4 \
          --version-id 3f9b...c1a8 \
          --source ./migration-safety-review \
          --install-source logion-marketplace
        installed: migration-safety-review@v1.0.2

  - id: security-authority
    title: Security is the authority
    layout: split
    body: >-
      Trust is the product surface, not a badge. Every listing is reviewable
      before acquisition and accountable after publication: capability
      declarations say what a bundle touches, automated scanners and human
      publication review gate every version, and published versions are
      immutable. The Open-source trust layer backs it up — the client and
      integration surface are public for inspection, so you can audit what an
      agent runs locally and what it sends to the marketplace. No MCP setup is
      required for the first workflow.
    proofs:
      - course/capabilities.yaml declarations
      - automated scanners
      - human publication review
      - immutable published versions
      - buyer-safe capability summaries
      - reports, takedowns, access revocation
      - execution policy export path
    links:
      - label: CLI source
        href: https://github.com/nicolasmelo1/logion/tree/main/packages/cli
      - label: Python SDK
        href: https://github.com/nicolasmelo1/logion/tree/main/packages/client
      - label: npm wrapper
        href: https://github.com/nicolasmelo1/logion/tree/main/packages/npm-wrapper
      - label: agent companion SKILL.md
        href: https://github.com/nicolasmelo1/logion/tree/main/packages/agent-companion
      - label: public OpenAPI contract
        href: https://github.com/nicolasmelo1/logion/tree/main/contracts/openapi
      - label: release manifests
        href: https://github.com/nicolasmelo1/logion/tree/main/releases
    caveat: >-
      Runtime sandbox enforcement is future runtime work — we don't claim it
      is solved. Until then, trust comes from review before publication and
      accountability after it.

  - id: loop
    title: How the marketplace loop works
    layout: split
    body: >-
      The heart of the product is a loop, not a transaction. An agent hits a
      wall, acquires a reviewed capability on trust, uses it on the task, and a
      funded bounty improves it — every turn leaves the marketplace stronger
      than the last. An agent improving alone gets better only for its owner;
      on the network, every proven improvement is shared, so joining today
      means starting at today's level, never from zero.
    items:
      - title: Creator publishes
        body: >-
          A creator packages a course bundle and submits it for publication
          review.
      - title: Buyer agent acquires
        body: >-
          The buyer agent receives an entitlement before installing or using the
          protected bundle.
      - title: Contributors improve
        body: >-
          Creator-funded bounties let contributors harden, extend, or repair
          useful bundles.

  - id: economy
    title: Credits, referrals, and bounties
    layout: split
    body: >-
      No platform subscription gate. Buyers top up credits (100 credits = $1)
      and spend them in-marketplace with no Stripe redirect per purchase; free
      courses cost zero credits. Creators keep 85% — the platform fee is 15%.
      Referrers can earn credits through the referral program, bounties are
      funded in credits, and bounty contributors cash out through Stripe
      Connect after acceptance.

  - id: install
    title: Install
    body: >-
      One line installs the Logion CLI and the agent companion, then runs
      onboarding. Point your agent — Claude, Codex, OpenCode, or Hermes — at
      Logion and it drives the marketplace for you: the CLI is the execution
      layer, and vendor integrations are thin wrappers over it. pipx and npx
      are alternate package-manager entrypoints that run the same onboarding.

cli:
  heading: Install
  body: >-
    The curl installer adds the CLI and the companion, then runs
    `logion onboarding` to wire up your agent. pipx and npx are alternate
    package-manager entrypoints that run the same onboarding. Use --cli-only or
    --no-onboarding to opt out.
  install:
    - label: curl primary (CLI + companion + onboarding)
      role: primary
      command: curl -fsSL https://logion.sh/install.sh | sh
    - label: pipx alternate
      role: alternate
      command: pipx install logion-cli && logion onboarding
    - label: npx alternate
      role: alternate
      command: npx @logionsh/cli onboarding
  quickstart:
    - logion onboarding
    - "# then talk to your agent — it uses Logion for you"

pricing:
  heading: Pricing
  intro: >-
    Logion has no platform subscription gate. Buyers top up credits and agents
    spend credits on paid course purchases. Free courses cost zero credits.
  rows:
    - label: Denomination
      value: 100 credits = $1
    - label: Platform fee
      value: 15% (creators keep 85%)
    - label: Buyer payment
      value: top up credits with Stripe; spend credits in-marketplace
    - label: Stripe redirect per purchase
      value: none
    - label: Free courses
      value: zero credits
    - label: Bounty funding
      value: funded in credits
    - label: Bounty cash-out
      value: Stripe Connect after acceptance
    - label: Referral rewards
      value: credits awarded subject to attribution and anti-abuse rules

referral:
  heading: Referral landing
  intro: >-
    The /c/<course_slug>?ref=CODE route renders the install/purchase command
    for the referred course with the referral code attached. The route sets
    no cookies and loads no third-party tracking scripts.
  command_template: "logion courses acquire {slug} --referral-code {code}"

