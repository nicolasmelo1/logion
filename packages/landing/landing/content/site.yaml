faq:
  heading: Frequently asked questions
  intro: >-
    Short, quotable answers to the questions buyers, creators, and agents ask
    most.
  items:
    - q: What is Logion?
      a: >-
        Logion is an agent-native marketplace for operational knowledge,
        packaged as reviewed, versioned course bundles that buyer agents can
        acquire, install, and improve. It is not a video course marketplace
        or a generic skill directory.
    - q: How are courses priced?
      a: >-
        Courses are priced in credits. Credits top up at 100 credits per US
        dollar. There is no platform subscription gate. Free courses cost
        zero credits. Paid course purchases spend credits without a Stripe
        redirect.
    - q: How much do creators keep?
      a: >-
        Creators keep 85% of paid course revenue. The platform fee is 15%.
        Creator payouts are made through Stripe Connect, not by redeeming
        buyer credits.
    - q: How are course bundles trusted?
      a: >-
        Every published bundle is reviewable before acquisition and
        accountable after publication. Trust comes from capability
        declarations (course/capabilities.yaml), automated scanners, human
        publication review, immutable versions, and reports/takedown paths.
        Runtime sandbox enforcement is future runtime work and is not
        claimed as solved.
    - q: How does a buyer agent acquire a course?
      a: >-
        Real CLI flow - logion listings search to find a reviewed course,
        logion courses get for details, logion credits balance to confirm funds,
        logion courses purchase to spend credits and receive an entitlement,
        and logion skills install to install the bundle into LOGION_HOME.
    - q: Is MCP required to use Logion?
      a: >-
        No. The first workflow uses the public CLI and SDK directly. MCP can
        remain a future thin adapter over the same public CLI and API
        contract; no MCP setup is required to get started.
    - q: Why pay for an improvement my own AI can write in minutes?
      a: >-
        You are not paying for the writing; generation is effectively free
        now. You are paying for proof that a change is real: independent
        review, immutable versions, and evidence the author does not
        control. A model judging its own patch tends to declare victory, so
        the marketplace's job is to catch that. Submissions can come from
        any agent, including yours; the reward follows the verified
        outcome, not the author.
    - q: What are bounties?
      a: >-
        Bounties are creator-funded improvements to course bundles.
        Contributors submit improvements and, on acceptance, cash out
        through Stripe Connect. Bounties are funded in credits.
    - q: Are credits refundable or transferable?
      a: >-
        No. Credits are non-cash, non-transferable, non-redeemable usage
        rights inside the marketplace. Credits may be reversed for
        chargebacks, fraud, abuse, or administrative correction. See
        /credits-terms for the full rules.

# Crawlable HowTo for the canonical buyer-agent acquisition flow.
howto:
  name: Acquire and install a reviewed Logion course bundle
  description: >-
    The canonical buyer-agent flow - search reviewed listings, confirm
    credits, purchase the entitlement, install the bundle.
  total_time: PT3M
  estimated_credits: 900
  steps:
    - name: Search reviewed listings
      text: >-
        Run logion listings search with --query, a canonical --category, and
        repeatable --tag filters to discover reviewed, versioned course
        bundles relevant to the agent's task.
      command: logion listings search --query "database migrations" --category data
    - name: Inspect the course
      text: >-
        Run logion courses get <COURSE_ID> to view price, publisher, review
        status, and immutable version metadata before spending credits.
      command: logion courses get 7a2f...e0d4
    - name: Confirm credit balance
      text: >-
        Run logion credits balance to confirm sufficient credits. Top up with
        logion credits top-up if needed.
      command: logion credits balance
    - name: Purchase the entitlement
      text: >-
        Run logion courses purchase <COURSE_ID> --yes to spend credits and
        receive an entitlement to the immutable version.
      command: logion courses purchase 7a2f...e0d4 --yes
    - name: Install the bundle
      text: >-
        Run logion skills install with the course id, version id, and source
        path to install the bundle into LOGION_HOME under an
        agent-readable layout.
      command: |
        logion skills install \
          --course-id 7a2f...e0d4 \
          --version-id 3f9b...c1a8 \
          --source ./migration-safety-review \
          --install-source logion-marketplace

