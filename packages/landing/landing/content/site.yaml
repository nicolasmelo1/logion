seo:
  # www, not the apex, and deliberately so. A zone apex already carries NS and
  # SOA records and the DNS spec reserves a CNAME node for the CNAME alone, so
  # only a subdomain can resolve by CNAME to Vercel's anycast edge — which is
  # why Vercel recommends www as the production domain with the apex
  # redirecting to it. That is what is deployed: the apex answers 308 -> www.
  #
  # This value is the single source of every URL the app emits (canonical link,
  # og:url, sitemap, llms.txt, design.txt, ai-catalog, agent-skills, JSON-LD),
  # so it must name the host that actually serves. It previously named the
  # apex, which meant the declared canonical was itself a permanent redirect —
  # third-party indexes recorded www anyway. `make check-canonical-host`
  # guards the agreement.
  #
  # The install one-liner in the copy below stays on the short apex form: it is
  # already published in released READMEs and packages, and curl follows the
  # 308. Machine-read URLs are canonical; a command a human types is brand.
  canonical_base: https://www.logion.sh
  default_title: "Logion — open registry of AI-agent artifacts, with proof"
  default_description: >-
    Logion is an open, versioned registry of AI-agent artifacts — skills,
    plugins, MCP servers, models — with provenance, scanner findings, and
    evidence attached to every version.
  keywords:
    - agent artifact registry
    - AI agent skills
    - MCP servers
    - artifact provenance
    - capabilities.yaml
    - bundle scanning
    - agent observability
    - bounties
    - LLM tooling
    - Claude Code skills
    - open protocols
    - AI Catalog
  theme_color: "#0a0a0a"
  locale: en_US
  organization:
    name: Logion
    legal_name: Logion
    url: https://www.logion.sh
