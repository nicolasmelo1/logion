ai:
  llms_txt_summary: >-
    Logion is an open, versioned registry of AI-agent artifacts: skills,
    plugins, MCP servers, and models. It records where each version came
    from and attaches first-party findings — capability declarations,
    scanner results over the whole bundle, and accountable update history.
    Publishers keep their own distribution; Logion indexes and attributes,
    it does not host or replace it. Thesis: generating improvements is
    cheap; proving they are real is scarce. Logion sells the proof, not the
    writing.

  # Routing guidance for an agent deciding whether Logion is the right tool.
  # Rendered into llms.txt and llms-full.txt, which is where agents and
  # readiness scanners look for it. Naming what Logion is *not* for is the
  # half that makes the rest credible — an entry that claims every job reads
  # as marketing and gets ignored.
  when_to_use:
    heading: When to use Logion
    use_when:
      - >-
        Your agent hit a task it does not know how to do well, and a reviewed
        playbook would beat improvising — search listings before writing the
        procedure from scratch.
      - >-
        You need proof a change is real rather than plausible: independent
        review, immutable versions, and evidence the author does not control.
      - >-
        You publish operational knowledge and want entitlements, versioning,
        and payouts handled instead of shipping a gist.
      - >-
        You want a known-good procedure improved and are willing to fund a
        bounty for the verified outcome rather than the writing.
    not_for:
      - >-
        General web search or scraping. Logion indexes reviewed course
        bundles, not the web.
      - >-
        Browsing a free directory of prompts or skills. Every bundle here is
        reviewed and versioned, and paid ones cost credits.
      - >-
        Video courses for humans. The artifacts are built for agents to
        install and run.
      - >-
        Model hosting or inference. Bring your own agent; Logion is what it
        acquires capability from.
    how_to_call: >-
      One command installs the CLI and the agent companion
      (curl -fsSL https://logion.sh/install.sh | sh). Run
      `logion identity onboarding` once, then drive it from your agent:
      `logion listings search`, `logion courses get`, `logion credits balance`,
      `logion courses purchase`, `logion skills install`. The companion skill
      at /.well-known/agent-skills/logion/SKILL.md carries the full routing.

  # Agentic Resource Discovery catalog, served at
  # /.well-known/ai-catalog.json. This is the index an agent probes *before*
  # reading any page, so every entry must resolve to a real artifact — the
  # published API contract and the companion skill we actually ship. Logion
  # deliberately has no MCP server (see the FAQ), so none is declared here;
  # an entry for one would be a discoverable dead end.
  catalog:
    spec_version: "1.0"
    # The spec suggests a did:web identifier, but resolving one requires
    # serving a DID document we do not publish. A bare domain is the honest
    # identifier until we do.
    #
    # Deliberately the apex, not www, and likewise for the `urn:air:logion.sh:`
    # entry identifiers below. An identifier names the organization and must
    # stay stable; a URL names whichever host serves today. Moving these to www
    # would re-identify every artifact the next time serving changes, which is
    # exactly what an identifier exists to prevent.
    host_identifier: logion.sh
    documentation_url: https://api.logion.sh/docs
    entries:
      - identifier: urn:air:logion.sh:openapi:marketplace-v1
        type: application/openapi+json
        url: https://api.logion.sh/openapi.json
        display_name: Logion API v1
        description: >-
          Versioned REST contract for resources, listings, evidence,
          credits, bounties, and reviews. Bearer-token authenticated.
        tags: [registry, rest, openapi]
      - identifier: urn:air:logion.sh:skill:logion
        type: application/agent-skills+md
        url: /.well-known/agent-skills/logion/SKILL.md
        display_name: Logion Companion
        description: >-
          Bootstrap skill that teaches an agent when and how to discover,
          inspect, install, and update artifacts indexed by Logion.
        tags: [skill, registry, cli]
      # The node's own catalog, nested rather than duplicated. This document
      # is hand-curated and lists what the landing itself serves; the node
      # catalog is generated from the resource layer and grows on its own.
      # Two documents answering one well-known URI on two hosts would make
      # the apex and the API disagree about what Logion offers, so the apex
      # stays the single discovery entry point and points at the other.
      - identifier: urn:air:logion.sh:catalog:node
        type: application/ai-catalog+json
        url: https://api.logion.sh/.well-known/ai-catalog.json
        display_name: Logion node catalog
        description: >-
          Resources this node publishes, generated from the resource layer.
          Entries Logion cannot attribute to their origin are withheld.
        tags: [catalog, node, ard]

  # Agent Skills discovery index, served at
  # /.well-known/agent-skills/index.json. The artifact is vendored into
  # content/ because Vercel deploys this package alone — a drift test keeps the
  # copy byte-identical to packages/agent-companion/SKILL.md, and the sha256
  # digest in the index is computed from the bytes we actually serve.
  agent_skills:
    - name: logion
      type: skill-md
      artifact: agent-skills/logion/SKILL.md
      description: >-
        Discover, inspect, install, and update Logion course bundles, and
        route creator course management. Use when an agent needs a capability
        it does not have and should look for a reviewed bundle before
        improvising, or when managing a course you publish on Logion.

  llms_txt_pages:
    - title: Documentation
      href: /docs
      description: Guides, API reference, and CLI reference. Every page also answers at its .md URL.
    - title: Documentation index (agents)
      href: /docs/llms.txt
      description: Flat index of every documentation page with its markdown URL.
    - title: Landing (markdown)
      href: /
      description: Full landing copy as markdown via content negotiation.
    - title: All site content (markdown)
