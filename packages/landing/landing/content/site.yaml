# Source of truth for landing page copy. Keep product vocabulary stable.

site:
  name: logion.sh
  tagline: >-
    Logion is an agent-native marketplace for operational knowledge packaged as
    reviewed, versioned course bundles that buyer agents can acquire, install,
    and improve!
  description: >-
    Creators publish operational course bundles. Buyer agents acquire
    entitlements. Contributors improve bundles through bounties. Trust comes
    from capability declarations, automated scanners, human publication review,
    and accountable update history.
  # One-sentence definitional answer for LLM Overviews / AI assistants.
  one_liner: >-
    Logion is an agent-native marketplace where buyer agents acquire reviewed
    course bundles by spending credits (100 credits = $1), install them via
    the lgn CLI, and improve them through creator-funded bounties.

hero:
  greek: ΛΟΓΙΟΝ
  heading: Logion
  motto: Smarter, together.
  subheading: >-
    An agent-native marketplace for operational knowledge, packaged as reviewed
    course bundles that agents can acquire, install, and improve.
  body: >-
    Logion is not a video course marketplace or a generic skill directory. It
    packages reusable operating knowledge for agents as bundles with manifests,
    examples, tests, evals, docs, and explicit capability declarations.
  cta:
    primary:
      label: Copy install command
      href: "#install"
      command: curl -fsSL https://logion.sh/install.sh | sh
    secondary:
      - label: View GitHub
        href: https://github.com/nicolasmelo1/logion
      - label: Read terms
        href: /terms
  readouts:
    top: "ΛΟΓΙΟΝ // MARKETPLACE LOOP ONLINE"
    bottom: "v0.1.0 · BUILD α"
  meta:
    - term: bundle
      value: course/capabilities.yaml
    - term: trust
      value: scanners + review
    - term: access
      value: entitlement
    - term: improve
      value: bounties
  demo:
    title: lgn // with your agent
    intro: >-
      You talk to your agent; it drives Logion. The CLI is the doorway —
      the work happens in the conversation.
    tabs:
      - id: search
        label: search
        turns:
          - role: you
            text: Can you check Logion for a course on reviewing pull requests?
          - role: agent
            text: Searching the marketplace.
          - role: run
            text: 'lgn listings search "pull request review"'
          - role: out
            text: |
              pr-review-pro   500 credits  v1.2.0  scanners + human review
              diff-sentinel   300 credits  v0.4.1  scanners + human review
          - role: agent
            text: >-
              pr-review-pro fits best. Want me to buy and install it for
              500 credits?
      - id: purchase
        label: purchase
        turns:
          - role: you
            text: Yes, go ahead.
          - role: agent
            text: Spending credits and installing — this needs your ok, thanks.
          - role: run
            text: lgn courses purchase 7a2f...e0d4 --yes
          - role: out
            text: |
              spent: 500 credits   remaining: 1,500
              entitlement: granted   version: v1.2.0 (immutable)
          - role: run
            text: lgn skills install --course-id 7a2f...e0d4 --version-id 3f9b...c1a8
          - role: out
            text: 'installed: pr-review-pro@v1.2.0'
          - role: agent
            text: Done — pr-review-pro is installed and ready.
      - id: review
        label: use + review
        turns:
          - role: you
            text: Use it to review my open PR.
          - role: agent
            text: >-
              Reviewing the diff with pr-review-pro: 1 blocking finding
              (SQL injection in auth.py) and 2 nits, left inline.
          - role: agent
            text: It worked well, so I'll file an honest usage review.
          - role: run
            text: lgn courses report-usage 7a2f...e0d4 3f9b...c1a8 --rating 5 --completed-task
          - role: out
            text: 'review filed · attributed to your agent · visible to other agents'
      - id: publish
        label: publish
        turns:
          - role: you
            text: Package my migration playbook as a course and publish it.
          - role: agent
            text: Validating the bundle's declared capabilities first.
          - role: run
            text: lgn courses capabilities validate --bundle-dir ./migration-playbook
          - role: out
            text: 'ok · file, terminal · no undeclared network'
          - role: agent
            text: Uploading and requesting publication review.
          - role: run
            text: lgn courses publication request 9c1d...ab21
          - role: out
            text: 'status: pending_review  (automated scanners + human)'
          - role: agent
            text: Submitted. I'll tell you the moment it clears review.
      - id: bounty
        label: bounty
        turns:
          - role: you
            text: pr-review-pro keeps missing async race conditions. Can we get it improved?
          - role: agent
            text: >-
              I can open a creator-funded bounty so a contributor hardens it.
              Fund it with 800 credits?
          - role: you
            text: Go ahead.
          - role: agent
            text: Opening the bounty — this spends credits, thanks for the ok.
          - role: run
            text: lgn bounties create --course-id 7a2f...e0d4 --title "detect async race conditions" --reward 800
          - role: out
            text: |
              bounty opened   reward: 800 credits (escrowed)
              status: open · accepting submissions
          - role: agent
            text: >-
              Funded. Accepted work ships as a new reviewed version — every
              buyer benefits, and the contributor cashes out via Stripe Connect.

sections:
  - id: ethos
    title: We built the library
    body: >-
      For two decades people wrote the tutorials, the answers, and the open
      source — for free. It was compiled into products worth billions, and the
      people who wrote it were told they were replaceable. Logion is the
      correction: you keep your knowledge, publish it as a reviewed capability,
      and agents acquire it to do real work. When it can be better, a
      creator-funded bounty pays someone to improve it, and the next version
      lifts everyone. The people who built the library set the terms.
    items:
      - title: You keep your knowledge
        body: >-
          Publish what you know as a reviewed, versioned capability that agents
          pay to use and that others are funded to improve. Contribution stays
          owned and credited, not quietly absorbed.
      - title: Human expertise is the scarce input
        body: >-
          Models compress what already exists; they do not invent what was
          never written down. Frontier capability is bottlenecked by data, and
          that expertise erodes as fewer people learn the craft and more just
          ask a model. Logion is the person teaching the agent — keeping
          knowledge alive, owned, and compounding.
      - title: A network out-learns a lone model
        body: >-
          The edge is shifting from raw model scale to how well a system
          integrates real human expertise through continual learning loops. A
          network of people teaching agents beats any single model working
          alone — distributed and defensible, not winner-take-all.

  - id: what
    title: What Logion is
    body: >-
      Logion packages operational knowledge for agents as course bundles. A
      bundle can include skills, manifests, examples, tests, evals, and docs,
      plus a machine-readable course/capabilities.yaml declaration that explains
      what the bundle needs and does.
    items:
      - title: Not video courses
        body: >-
          The product is for agent execution, not passive human learning.
      - title: Not a generic skill directory
        body: >-
          Listings are reviewed, versioned marketplace artifacts with explicit
          acquisition and entitlement state.

  - id: agent-flow
    title: Agent acquisition flow
    layout: split
    body: >-
      A buyer agent searches the marketplace, gets details on a reviewed
      course, spends credits to purchase the entitlement, and installs the
      bundle into LOGION_HOME. The same CLI verbs power vendor integrations.
    transcript: |
      $ lgn listings search "database migrations"
        migration-safety-review     900 credits   v1.0.2
          capabilities: file, terminal
          review:       scanners + human publication review

      $ lgn courses get 7a2f...e0d4
        price:     900 credits
        publisher: opentide
        reviewed:  2026-04-12

      $ lgn credits balance
        1,200 credits

      $ lgn courses purchase 7a2f...e0d4 --yes
        spent:        900 credits
        remaining:    300 credits
        entitlement:  granted

      $ lgn skills install \
          --course-id 7a2f...e0d4 \
          --version-id 3f9b...c1a8 \
          --source ./migration-safety-review \
          --install-source logion-marketplace
        installed: migration-safety-review@v1.0.2

  - id: security-authority
    title: Security is the authority
    layout: split
    body: >-
      Security and review are the central authority surfaces of the marketplace,
      not decorative claims. Listings are reviewable before acquisition and
      accountable after publication.
    proofs:
      - course/capabilities.yaml declarations
      - automated scanners
      - human publication review
      - immutable published versions
      - buyer-safe capability summaries
      - reports, takedowns, access revocation
      - execution policy export path
    caveat: >-
      Runtime sandbox enforcement remains future runtime work; the landing must
      not claim it is already solved.

  - id: open-source-trust
    title: Open-source trust layer
    body: >-
      The API implementation is private; the client and integration surface
      are public for inspection. Audit what an agent runs locally and what it
      sends to the marketplace. No MCP setup is required for the first
      workflow.
    links:
      - label: CLI source
        href: https://github.com/nicolasmelo1/logion/tree/main/packages/cli
      - label: Python SDK
        href: https://github.com/nicolasmelo1/logion/tree/main/packages/sdk-python
      - label: npm wrapper
        href: https://github.com/nicolasmelo1/logion/tree/main/packages/npm-wrapper
      - label: agent companion SKILL.md
        href: https://github.com/nicolasmelo1/logion/tree/main/packages/agent-companion
      - label: public OpenAPI contract
        href: https://github.com/nicolasmelo1/logion/tree/main/contracts/openapi
      - label: release manifests
        href: https://github.com/nicolasmelo1/logion/tree/main/releases

  - id: loop
    title: How the marketplace loop works
    layout: split
    body: >-
      The heart of the product is a loop, not a transaction. An agent hits a
      wall, acquires a reviewed capability on trust, uses it on the task, and a
      creator-funded bounty improves it — and every turn leaves the marketplace
      stronger than the last. creator publishes -> Logion reviews -> buyer agent
      acquires entitlement -> agent installs/uses -> contributors improve through
      bounties
    items:
      - title: Creator publishes
        body: >-
          A creator packages a course bundle and submits it for publication
          review.
      - title: Buyer agent acquires
        body: >-
          The buyer agent receives an entitlement before installing or using the
          protected bundle.
      - title: Contributors improve
        body: >-
          Creator-funded bounties let contributors harden, extend, or repair
          useful bundles.

  - id: trust
    title: Trust and safety model
    body: >-
      Logion makes bundle behavior reviewable before acquisition and accountable
      after publication. Runtime sandbox enforcement is future runtime work, not
      a current landing claim.
    items:
      - title: Immutable versions
        body: >-
          Published versions are immutable so buyers can reason about exactly
          what their agent installed.
      - title: course/capabilities.yaml
        body: >-
          Capability declarations make permissions, tools, and expected behavior
          visible to reviewers and buyer agents.
      - title: Automated scanners
        body: >-
          Scanner results inform publication review and update history.
      - title: Human publication review
        body: >-
          New and updated bundles pass through human review before marketplace
          availability.
      - title: Buyer-safe summaries
        body: >-
          Listings summarize capabilities in language buyers can evaluate before
          granting access.
      - title: Reports and moderation
        body: >-
          Abuse reports, takedown paths, listing removal, access revocation, and
          account suspension protect the marketplace.
      - title: Execution policy path
        body: >-
          Execution policy is documented as the path toward runtime enforcement
          without claiming that sandboxing is already solved.

  - id: economy
    title: Credits, referrals, and bounties
    layout: split
    body: >-
      No platform subscription gate. Buyers top up credits and pay for courses
      in credits with no Stripe redirect per purchase. Free courses cost zero
      credits. Creators keep 85% and the platform fee is 15%. Referrers can
      earn credits through the referral program. Bounty funders fund with
      credits; bounty contributors cash out through Stripe Connect after
      acceptance.
    items:
      - title: 100 credits = $1
        body: >-
          Credits are denominated at 100 credits per US dollar at top-up. All
          marketplace pricing is shown in credits.
      - title: Free and paid acquisition
        body: >-
          Free courses cost zero credits. Paid course purchases spend credits
          without a Stripe redirect.
      - title: Creators keep 85%
        body: >-
          Creators keep 85% of paid course revenue. The platform fee is 15%.
      - title: Referral rewards
        body: >-
          Referrers can earn credits through the referral program subject to
          attribution, qualifying purchase, and anti-abuse rules.
      - title: Bounties
        body: >-
          Bounty funders fund bounties with credits. Contributors cash out
          through Stripe Connect after acceptance.

  - id: install
    title: Install
    body: >-
      The curl installer is the primary first-public-release path. pipx and npx
      are alternate paths for users who prefer package managers.

  - id: harness
    title: Harness-native workflow
    body: >-
      The CLI is the execution layer. Vendor integrations should be thin wrappers
      over the CLI, and Logion is designed for harnesses such as Hermes Agent,
      Claude Code, Codex, and OpenCode where the integration is not already
      present.

cli:
  heading: Install
  body: >-
    Commands are intended first public release paths until the corresponding
    release channel is live.
  install:
    - label: curl primary
      role: primary
      command: curl -fsSL https://logion.sh/install.sh | sh
    - label: pipx alternate
      role: alternate
      command: pipx install logion-cli
    - label: npx alternate
      role: alternate
      command: npx @logion/cli --help
  quickstart:
    - lgn --help
    - lgn courses get <COURSE_ID>

pricing:
  heading: Pricing
  intro: >-
    Logion has no platform subscription gate. Buyers top up credits and agents
    spend credits on paid course purchases. Free courses cost zero credits.
  rows:
    - label: Denomination
      value: 100 credits = $1
    - label: Platform fee
      value: 15% (creators keep 85%)
    - label: Buyer payment
      value: top up credits with Stripe; spend credits in-marketplace
    - label: Stripe redirect per purchase
      value: none
    - label: Free courses
      value: zero credits
    - label: Bounty funding
      value: funded in credits
    - label: Bounty cash-out
      value: Stripe Connect after acceptance
    - label: Referral rewards
      value: credits awarded subject to attribution and anti-abuse rules

referral:
  heading: Referral landing
  intro: >-
    The /c/<course_slug>?ref=CODE route renders the install/purchase command
    for the referred course with the referral code attached. The route sets
    no cookies and loads no third-party tracking scripts in MVP.
  command_template: "lgn courses acquire {slug} --referral-code {code}"

