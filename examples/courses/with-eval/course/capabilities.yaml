# course/capabilities.yaml — with-eval example
#
# PR review checklist with a bundled deterministic eval. Runs entirely
# locally — no network, no secrets, no human approval. The eval is the
# trust-clean pattern in action: bundled fixtures + bundled scorer +
# stdlib only.

version: 1

summary: >-
  PR review checklist with a deterministic eval that catches "faking"
  agents. The agent reviews diffs against a bundled checklist; the
  scorer mechanically checks whether planted issues were flagged.

tools:
  - file
  - terminal

filesystem:
  read:
    - .
  write:
    - ./evals/reviews
    - ./evals/reports

human_approval:
  required: false

# runtime — the eval harness is stdlib-only but the bundled scorer may
# use uv-managed dependencies.  The install command is disclosure only;
# Logion never auto-runs it.  human_approval stays false because the
# eval runs locally with no network or secrets.
runtime:
  requires:
    bins:
      - python3
    any_bins:
      - - uv
        - pip
  install:
    - kind: uv
      command: "uv sync"
      notes: "Disclosure only — Logion never auto-runs this."
